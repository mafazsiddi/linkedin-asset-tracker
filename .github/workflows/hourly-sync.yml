name: Hourly LinkedIn sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync
        run: |
          status=$(curl -s -o /tmp/response.json -w '%{http_code}' \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://linkedin-asset-tracker.vercel.app/api/cron/sync)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Sync failed"
            exit 1
          fi
