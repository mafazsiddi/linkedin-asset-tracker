  // ---- asset library: the asset records on their own ----
  //
  // Deliberately metric-free. Everywhere else in the app an asset is shown next to its spend and
  // impressions, which is the right framing for reporting but the wrong one for producing: the
  // people filling this in care about who owns a brief, when it's due and where the file lives.
  // This is also the only bulk entry point — the rest of the app creates assets one modal at a time.

  var CSV_COLUMNS = [
    { key:'title',        header:'title',         required:true },
    { key:'country',      header:'country',       required:true },
    { key:'campaign',     header:'campaign' },
    { key:'type',         header:'type' },
    { key:'status',       header:'status' },
    { key:'priority',     header:'priority' },
    { key:'requestedBy',  header:'requested_by' },
    { key:'assignedTo',   header:'assigned_to' },
    { key:'dueDate',      header:'due_date' },
    { key:'version',      header:'version' },
    { key:'link',         header:'asset_link' },
    { key:'adCopyLink',   header:'ad_copy_link' },
    { key:'creativeLink', header:'creative_link' },
    { key:'notes',        header:'notes' }
  ];

  // A hand-rolled parser rather than a library: the page has no build step and one more CDN script
  // is one more thing that can fail to load. Handles quoted fields containing commas, escaped
  // quotes ("") and both newline conventions, which covers what Excel and Sheets actually emit.
  function parseCSV(text){
    var rows=[], row=[], field='', inQuotes=false;
    text = text.replace(/^﻿/, ''); // Excel writes a BOM; it would otherwise corrupt the first header
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(inQuotes){
        if(ch==='"'){
          if(text[i+1]==='"'){ field+='"'; i++; }
          else inQuotes=false;
        } else field+=ch;
        continue;
      }
      if(ch==='"'){ inQuotes=true; continue; }
      if(ch===','){ row.push(field); field=''; continue; }
      if(ch==='\r'){ continue; }
      if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; continue; }
      field+=ch;
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
  }

  function normaliseHeader(h){ return String(h||'').trim().toLowerCase().replace(/[\s-]+/g,'_'); }

  // Maps a parsed CSV into asset payloads, resolving country and campaign names to IDs. Rows that
  // can't be resolved are kept with an `error` rather than dropped, so the preview can show exactly
  // which line to fix instead of silently importing fewer rows than the file had.
  function csvToRows(text){
    var grid=parseCSV(text);
    if(!grid.length) return { rows:[], error:'That file has no rows in it.' };
    var headers=grid[0].map(normaliseHeader);
    // Accept the friendlier spellings people actually type in a spreadsheet.
    var ALIASES = { market:'country', name:'title', asset:'title', owner:'assigned_to', assignee:'assigned_to', due:'due_date', ad_set:'campaign', adset:'campaign' };
    headers=headers.map(function(h){ return ALIASES[h]||h; });
    if(headers.indexOf('title')===-1) return { rows:[], error:'The file needs a "title" column.' };
    if(headers.indexOf('country')===-1) return { rows:[], error:'The file needs a "country" (or "market") column.' };

    var byHeader={};
    CSV_COLUMNS.forEach(function(c){ byHeader[c.header]=c.key; });

    var out=grid.slice(1).map(function(cells, i){
      var rec={ _line:i+2 };
      headers.forEach(function(h, idx){
        var key=byHeader[h];
        if(key) rec[key]=String(cells[idx]==null?'':cells[idx]).trim();
      });
      var country=countries.find(function(c){ return c.country.toLowerCase()===String(rec.country||'').toLowerCase(); });
      if(!rec.title) rec.error='missing title';
      else if(!country) rec.error='unknown country "'+(rec.country||'')+'"';
      else rec.marketId=country.id;
      if(rec.type && TYPE_LIST.indexOf(rec.type)===-1) rec.type='';
      if(rec.status && STATUS_LIST.indexOf(rec.status)===-1) rec.status='';
      if(rec.dueDate && !/^\d{4}-\d{2}-\d{2}$/.test(rec.dueDate)) { rec.dueDate=''; rec.warning='due date ignored (needs YYYY-MM-DD)'; }
      return rec;
    });
    return { rows:out };
  }

  function csvTemplate(){
    return CSV_COLUMNS.map(function(c){return c.header;}).join(',')+'\n'
      + '"Beyond e-Invoicing",Global,GLOBAL_US_E-INV_AUG_26,Document,Briefed,High,Tanya Gupta,Anna,2026-09-15,v1,https://drive.google.com/...,,,"Doc ad for the UK finance audience"\n';
  }
  function downloadFile(name, text, mime){
    var blob=new Blob([text], { type:mime||'text/csv;charset=utf-8;' });
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function csvCell(v){
    var s=String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
  function exportLibraryCsv(){
    var list=libraryRows();
    var lines=[CSV_COLUMNS.map(function(c){return c.header;}).join(',')];
    list.forEach(function(a){
      lines.push([a.title, a.market, a.campaign, a.type, a.status, a.priority||'', a.requestedBy||'',
        a.assignedTo||'', a.dueDate||'', a.version||'', a.link||'', a.adCopyLink||'', a.creativeLink||'', a.notes||'']
        .map(csvCell).join(','));
    });
    downloadFile('assets.csv', lines.join('\n'));
  }

  async function commitImport(rows){
    var usable=rows.filter(function(r){ return !r.error; });
    if(!usable.length){ showToast('Nothing to import — every row has a problem.'); return; }
    // Campaign names are resolved (and created when new) one at a time before the bulk insert,
    // because the bulk endpoint takes campaign IDs — it has no way to invent campaigns safely.
    for(var i=0;i<usable.length;i++){
      var r=usable[i];
      if(r.campaign){
        try { r.campaignId=await resolveCampaignId(r.marketId, r.campaign); }
        catch(e){ r.campaignId=null; }
      }
    }
    var payload=usable.map(function(r){
      return {
        title:r.title, type:r.type||'Image', marketId:r.marketId, campaignId:r.campaignId||null,
        requestedBy:r.requestedBy||null, assignedTo:r.assignedTo||null, priority:r.priority||'Medium',
        dueDate:r.dueDate||null, status:r.status||'Requested', version:r.version||'v1',
        link:r.link||null, adCopyLink:r.adCopyLink||null, creativeLink:r.creativeLink||null,
        notes:r.notes||null
      };
    });
    var result=await api('/api/assets', { method:'POST', body: JSON.stringify({ assets: payload }) });
    await Promise.all([refreshAssets(), refreshCampaigns(), refreshNotifications()]);
    libraryDraftRows=null;
    closeModal();
    var msg=result.created+' asset'+(result.created===1?'':'s')+' imported';
    if(result.failed) msg+=' · '+result.failed+' failed ('+esc(result.errors.slice(0,3).map(function(e){return 'row '+e.row+': '+e.error;}).join('; '))+')';
    showToast(msg+'.');
  }

  function openImportModal(text){
    var parsed=csvToRows(text);
    if(parsed.error){ showToast(parsed.error); return; }
    libraryDraftRows=parsed.rows;
    var good=parsed.rows.filter(function(r){return !r.error;}).length;
    var bad=parsed.rows.length-good;
    var preview=parsed.rows.slice(0, 50).map(function(r){
      return '<tr'+(r.error?' style="background:rgba(255,92,97,.07);"':'')+'>'
        + '<td class="dim">'+r._line+'</td>'
        + '<td style="font-weight:600;">'+esc(r.title||'—')+'</td>'
        + '<td>'+esc(r.country||'—')+'</td>'
        + '<td class="dim">'+esc(r.campaign||'—')+'</td>'
        + '<td style="color:'+(r.error?'var(--danger)':'var(--faint)')+';">'+esc(r.error||r.warning||'ok')+'</td>'
        + '</tr>';
    }).join('');
    var body='<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">'
      + '<b>'+good+'</b> row'+(good===1?'':'s')+' ready to import'+(bad?', <b style="color:var(--danger);">'+bad+'</b> with problems (skipped)':'')+'.'
      + (parsed.rows.length>50?' Showing the first 50.':'')+'</div>'
      + '<div class="scroll-x" style="max-height:44vh; overflow-y:auto;"><table class="data-table" style="min-width:520px; font-size:12px;">'
      + '<thead><tr>'
      + ['Line','Title','Country','Ad set','Status'].map(function(h){ return '<th>'+h+'</th>'; }).join('')
      + '</tr></thead><tbody>'+preview+'</tbody></table></div>';
    showModal('Import assets from CSV', body, async function(){
      await commitImport(libraryDraftRows||[]);
      // commitImport closes the modal itself once the refreshes are in, so don't close twice.
      return false;
    });
    var saveBtn=document.getElementById('modal-save-btn');
    if(saveBtn) saveBtn.textContent='Import '+good+' asset'+(good===1?'':'s');
  }

  function libraryRows(){
    var q=libFilters.q.toLowerCase(), st=libFilters.status, mk=libFilters.country;
    return assets.filter(function(a){
      if(st && a.status!==st) return false;
      if(mk && String(a.marketId)!==String(mk)) return false;
      if(q && a.title.toLowerCase().indexOf(q)===-1 && (a.campaign||'').toLowerCase().indexOf(q)===-1
           && (a.assignedTo||'').toLowerCase().indexOf(q)===-1) return false;
      return true;
    });
  }

    el.innerHTML='<div class="card fadein" style="padding:17px 19px; margin-bottom:14px;">'

      + heads.map(function(h){ return '<th>'+h+'</th>'; }).join('')
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="9" class="empty">No asset records'+(assets.length?' match these filters':' yet')+'</td></tr>')+'</tbody></table></div>';

    // Filter values are re-read from the DOM on each render, so restore what was typed.

  // that campaign — rather than figures specific to this one ad.
  function metricsSourceNote(a){

    if(a.metricsSource==='campaign') return 'No LinkedIn ad linked — showing the whole campaign’s totals, shared with every other asset on it. Add the ad/creative ID above for numbers specific to this asset.';

      + '<div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--indigo); margin:-6px 0 13px;">'+icon('bell',12,'currentColor',1.9)+'<span>The assignee is notified when you save.</span></div>'
      + field('Status','<select id="m-status">'+statusOpts+'</select>')
      + '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">'+field('Due date','<input id="m-duedate" type="date" value="'+esc(a.dueDate)+'" />')+field('Date delivered','<input id="m-delivered" type="date" value="'+esc(a.dateDelivered)+'" />')+'</div>'
      + field('Shared asset link','<input id="m-link" value="'+esc(a.link)+'" placeholder="https://drive.google.com/..." />')
      + field('Version','<input id="m-version" value="'+esc(a.version)+'" placeholder="v1" />')
      + field('Notes / feedback','<textarea id="m-notes" rows="2">'+esc(a.notes)+'</textarea>')
      + '<div class="section-title">'+icon('copy',13,'var(--muted)',1.8)+' Creatives</div>'
      + field('Ad copies link','<input id="m-adcopy" value="'+esc(a.adCopyLink)+'" placeholder="Doc with headlines &amp; body copy" />')
      + field('Creatives link','<input id="m-creative" value="'+esc(a.creativeLink)+'" placeholder="Folder with designs, video &amp; images" />')
      + '<div class="section-title">'+icon('chart',13,'var(--muted)',1.8)+' Ad performance ('+reportingPeriodLabel()+', '+(a.liCreativeId?'this ad':'campaign-level')+')</div>'
      + (id
          ? '<div style="display:flex; flex-wrap:wrap; gap:6px;">'+metricList(a).map(function(x){ return '<span class="chip"><b>'+x[1]+'</b> '+x[0]+'</span>'; }).join('')+'</div>'
            + '<div style="font-size:11px; color:var(--faint); margin-top:6px;">'+metricsSourceNote(a)+'</div>'
          : '<div style="font-size:11.5px; color:var(--faint);">Save the asset first, then log performance for its campaign from the country view.</div>');

    showModal(id?'Edit asset':'New asset', body, async function(){
      var prevAssignee = a.assignedTo || '';
      var marketId = Number(document.getElementById('m-market').value) || null;
      var campaignName = v('m-campaign');
      if(!v('m-title')){ showToast('Give the asset a title.'); return false; }
      if(!marketId){ showToast('Select a country.'); return false; }
      var vals = {
        title: v('m-title'), type: document.getElementById('m-type').value, marketId: marketId,
        assignedTo: v('m-assignedto'),
        dueDate: document.getElementById('m-duedate').value, dateDelivered: document.getElementById('m-delivered').value,
        status: document.getElementById('m-status').value, link: v('m-link'), version: v('m-version'),
        adCopyLink: v('m-adcopy'), creativeLink: v('m-creative'), notes: v('m-notes'),
        liCreativeId: v('m-licreative')
      };
      vals.campaignId = await resolveCampaignId(marketId, campaignName);
      var payload = assetToApiBody(vals);
      var saved = id
        ? await api('/api/assets/'+id, { method:'PUT', body: JSON.stringify(payload) })
        : await api('/api/assets', { method:'POST', body: JSON.stringify(payload) });
      var mapped = mapAssetFromApi(saved);
      if(id){ var idx=assets.findIndex(function(x){return x.id===id;}); assets[idx]=mapped; }
      else { assets.push(mapped); }
      renderAll();
      if(mapped.assignedTo && mapped.assignedTo!==prevAssignee){
        await refreshNotifications();
        showToast(icon('bell',14,'#fff',2)+' '+esc(mapped.assignedTo)+' notified — assigned “'+esc(mapped.title)+'”');
      }
      return true;
    }, id?async function(){
      await api('/api/assets/'+id, { method:'DELETE' });
      assets=assets.filter(function(x){return x.id!==id;});
      renderAll();
      refreshNotifications();
    }:null);

    var marketSel = document.getElementById('m-market');
    function refreshCampaignDatalist(){
      var mid = Number(marketSel.value)||null;
      var dl = document.getElementById('m-campaign-list');
      dl.innerHTML = campaignsForMarket(mid).map(function(c){return '<option value="'+esc(c.name)+'"></option>';}).join('');
    }
    marketSel.addEventListener('change', refreshCampaignDatalist);
    refreshCampaignDatalist();

    // Pulls the real ads under the typed campaign so the creative ID can be picked rather than
    // copied out of Campaign Manager by hand.
    document.getElementById('m-fetch-creatives').addEventListener('click', async function(){
      var hint = document.getElementById('m-creative-hint');
      var campaignId = campaignIdForName(Number(marketSel.value)||null, v('m-campaign'));
      if(!campaignId){ hint.textContent = 'Pick a country and an existing campaign first, then save once.'; return; }
      hint.textContent = 'Looking up ads…';
      try {
        var list = await api('/api/campaigns/'+campaignId+'?creatives=1');
        if(!list.length){ hint.textContent = 'LinkedIn returned no ads for this campaign.'; return; }
        document.getElementById('m-creative-list').innerHTML = list.map(function(c){
          var label = c.name + (c.linkedToAsset ? ' — already on “'+c.linkedToAsset+'”' : '');
          return '<option value="'+esc(c.creativeId)+'">'+esc(label)+'</option>';
        }).join('');
        hint.textContent = list.length+' ad'+(list.length===1?'':'s')+' found — pick one from the field above.';
      } catch(e){
        hint.textContent = e.message;
      }
    });
  }
  // Local campaign row for a market + exact name, without creating one as resolveCampaignId does.
  function campaignIdForName(marketId, name){
    if(!name) return null;
    var c = campaigns.find(function(x){ return x.marketId===marketId && x.name.toLowerCase()===name.toLowerCase(); });
    return c ? c.id : null;
  }
  function v(id){ return document.getElementById(id).value.trim(); }

  function openCampaignModal(id, presetMarketId){
    var c = id ? campaigns.find(function(x){return x.id===id;}) : { name:'', liCampaignId:'', marketId: presetMarketId||null };
    var marketOpts = countries.slice().sort(function(x,y){return x.country.localeCompare(y.country);}).map(function(m){return '<option value="'+m.id+'" '+(c.marketId===m.id?'selected':'')+'>'+esc(m.country)+'</option>';}).join('');
    var body = field('Market','<select id="cm-market">'+marketOpts+'</select>')
      + field('Campaign name (must match Campaign Manager exactly)','<input id="cm-name" value="'+esc(c.name)+'" placeholder="UAE_EN - Compliance" />')
      + field('LinkedIn campaign ID','<input id="cm-liid" value="'+esc(c.liCampaignId)+'" placeholder="e.g. 123456789" />');
    showModal(id?'Edit campaign':'New campaign', body, async function(){
      var vals={ name:v('cm-name'), marketId:Number(document.getElementById('cm-market').value)||null, liCampaignId:v('cm-liid') };
      if(!vals.name){ showToast('Give the campaign a name.'); return false; }
      if(!vals.marketId){ showToast('Select a market.'); return false; }
      var payload = { name:vals.name, marketId:vals.marketId, liCampaignId: vals.liCampaignId || null };
      var saved = id
        ? await api('/api/campaigns/'+id, { method:'PUT', body: JSON.stringify(payload) })
        : await api('/api/campaigns', { method:'POST', body: JSON.stringify(payload) });
      var mapped = mapCampaignFromApi(saved);
      if(id){ var idx=campaigns.findIndex(function(x){return x.id===id;}); campaigns[idx]=mapped; } else { campaigns.push(mapped); }
      renderAll();
      return true;
    }, id?async function(){
      await api('/api/campaigns/'+id, { method:'DELETE' });
      campaigns=campaigns.filter(function(x){return x.id!==id;});
      await refreshAssets();
    }:null);
  }

  function openMetricsModal(campaignId, campaignName){
    // Leads are only offered for lead-gen campaigns, matching where they're displayed. Reach isn't
    // asked for at all — it isn't shown anywhere, so collecting it by hand would be busywork.
    var leadGen = isLeadGenCampaign(campaignById(campaignId));
    var body = '<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">Logs a manual entry for <b>'+esc(campaignName)+'</b> — the next automatic sync will overwrite this day\'s numbers.</div>'
      + field('Date','<input id="mm-date" type="date" value="'+isoToday()+'" />')
      + '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">'+field('Spend (₹)','<input id="mm-spend" type="number" min="0" step="0.01" value="0" />')+field('Impressions','<input id="mm-impressions" type="number" min="0" step="1" value="0" />')+field('Clicks','<input id="mm-clicks" type="number" min="0" step="1" value="0" />')+'</div>'
      + (leadGen ? field('Leads','<input id="mm-leads" type="number" min="0" step="1" value="0" />') : '');
    showModal('Log metrics', body, async function(){
      var leadsEl = document.getElementById('mm-leads');
      await api('/api/metrics/manual', { method:'POST', body: JSON.stringify({
        campaignId: campaignId,
        date: document.getElementById('mm-date').value,
        spend: num(document.getElementById('mm-spend').value),
        impressions: num(document.getElementById('mm-impressions').value),
        clicks: num(document.getElementById('mm-clicks').value),
        leads: leadsEl ? num(leadsEl.value) : 0
      }) });
      await Promise.all([refreshAssets(), refreshCampaigns()]);
      showToast('Metrics logged for '+esc(campaignName)+'.');
      return true;
    });
  }

  function openCountryModal(id){
    var c = id ? countries.find(function(x){return x.id===id;}) : { country:"", pocName:"", channel:"", link:"", notes:"" };
    var body=field('Country','<input id="c-country" value="'+esc(c.country)+'" placeholder="UAE" />')
      + field('POC name','<input id="c-pocname" value="'+esc(c.pocName)+'" placeholder="Full name" />')
      + field('Preferred sharing channel','<input id="c-channel" value="'+esc(c.channel)+'" placeholder="Slack #uae-content, Email, Teams..." />')
      + field('Shared asset folder link','<input id="c-link" value="'+esc(c.link)+'" placeholder="https://drive.google.com/..." />')
      + field('Notes','<textarea id="c-notes" rows="2">'+esc(c.notes)+'</textarea>');
    showModal(id?'Edit country':'Add country', body, async function(){
      var vals={ country:v('c-country'), pocName:v('c-pocname'), channel:v('c-channel'), link:v('c-link'), notes:v('c-notes') };
      if(!vals.country){ showToast('Give the country a name.'); return false; }
      var payload = marketToApiBody(vals);
      var saved = id
        ? await api('/api/markets/'+id, { method:'PUT', body: JSON.stringify(payload) })
        : await api('/api/markets', { method:'POST', body: JSON.stringify(payload) });
      var mapped = mapMarketFromApi(saved);
      if(id){ var idx=countries.findIndex(function(x){return x.id===id;}); countries[idx]=mapped; }
      else { expanded[mapped.id]=true; countries.push(mapped); }
      renderAll();
      return true;
    }, id?async function(){
      await api('/api/markets/'+id, { method:'DELETE' });
      countries=countries.filter(function(x){return x.id!==id;});
      // Deleting a market cascades to its campaigns/assets/notifications server-side — pull fresh state.
      await Promise.all([refreshAssets(), refreshCampaigns(), refreshNotifications()]);
    }:null);
  }

  function showModal(title, bodyHtml, onSave, onDelete){
    var layer=document.getElementById('modal-layer');
    layer.innerHTML='<div id="modal-backdrop" style="position:fixed; inset:0; background:rgba(4,6,11,.7); display:flex; align-items:flex-start; justify-content:center; z-index:9999; padding:40px 16px; overflow-y:auto;">'
      + '<div class="card" style="width:100%; max-width:560px; padding:22px; background:var(--card);">'
      + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">'
      + '<div class="disp" style="font-size:17px; font-weight:700;">'+title+'</div>'
      + '<button class="btn btn-sm" id="modal-close-btn">Close</button></div>'
      + '<div>'+bodyHtml+'</div>'
      + '<div id="modal-footer" style="display:flex; justify-content:space-between; align-items:center; margin-top:18px;">'
      + (onDelete?'<button class="btn" id="modal-delete-btn" style="color:var(--danger); border-color:rgba(255,92,97,.45);">Delete</button>':'<span></span>')
      + '<button class="btn btn-primary" id="modal-save-btn">Save</button></div>'
      + '</div></div>';
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', function(e){ if(e.target.id==='modal-backdrop') closeModal(); });
    document.getElementById('modal-save-btn').addEventListener('click', function(){
      var result;
      try { result = onSave(); } catch(err){ showToast(err.message||'Something went wrong.'); return; }
      Promise.resolve(result).then(function(ok){ if(ok!==false) closeModal(); }).catch(function(err){ showToast(err.message||'Something went wrong.'); });
    });
    if(onDelete){
      var delBtn=document.getElementById('modal-delete-btn');
      var armed=false, delTimer=null;
      function resetDel(){ armed=false; delBtn.textContent='Delete'; delBtn.style.background=''; delBtn.style.color='var(--danger)'; delBtn.style.borderColor='rgba(255,92,97,.45)'; }
      delBtn.addEventListener('click', function(){
        if(!armed){
          armed=true; delBtn.textContent='Confirm delete';
          delBtn.style.background='var(--danger)'; delBtn.style.color='#fff'; delBtn.style.borderColor='var(--danger)';
          delTimer=setTimeout(resetDel, 3000);
        } else {
          clearTimeout(delTimer);
          Promise.resolve().then(onDelete).then(function(){ closeModal(); }).catch(function(err){ showToast(err.message||'Delete failed.'); });
        }
      });
    }
  }
  function closeModal(){ document.getElementById('modal-layer').innerHTML=''; }

  function timeAgo(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'just now';
    var m=Math.floor(s/60); if(m<60) return m+'m ago';
    var h=Math.floor(m/60); if(h<24) return h+'h ago';
    return Math.floor(h/24)+'d ago';
  }
  function renderBell(){
    var b=document.getElementById('bell-badge'); if(!b) return;
    var u=notifications.filter(function(n){return !n.read;}).length;
    b.style.display=u>0?'inline-flex':'none'; b.textContent=u>99?'99+':u;
  }
  function showToast(html){
    var t=document.createElement('div');
    t.innerHTML='<span style="display:inline-flex; align-items:center; gap:8px;">'+html+'</span>';
    t.style.cssText='position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px); background:#1E2333; color:#E8EBF3; border:1px solid #28303F; box-shadow:0 14px 34px -12px rgba(0,0,0,.85); padding:12px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:600; z-index:10000; opacity:0; transition:opacity .2s, transform .2s; max-width:90%;';
    document.getElementById('app-root').appendChild(t);
    requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
    setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(8px)'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },260); }, 2800);
  }
  function openNotifModal(){
    api('/api/notifications/read', { method:'POST', body: JSON.stringify({}) }).catch(function(){});
    notifications.forEach(function(n){ n.read=true; }); renderBell();
    var listHtml = notifications.length ? notifications.map(function(n){
      return '<div style="display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line-soft);">'
        + '<div class="icobox" style="width:32px; height:32px; border-radius:9px; background:var(--indigo-tint); color:var(--indigo); flex:none;">'+icon('user',16,'currentColor',1.8)+'</div>'
        + '<div style="flex:1; min-width:0;"><div style="font-size:12.5px; line-height:1.35;"><b>'+esc(n.to)+'</b> was assigned <b>“'+esc(n.title)+'”</b></div>'
        + '<div style="font-size:11px; color:var(--muted); margin-top:3px;">'+flagFor(n.market)+' '+esc(n.market)+' · '+timeAgo(n.ts)+'</div></div></div>';
    }).join('') : '<div style="text-align:center; padding:26px 8px; color:var(--faint);"><div class="icobox" style="justify-content:center;">'+icon('bell',26,'var(--faint)',1.6)+'</div><div style="font-size:12.5px; margin-top:8px;">No assignment notifications yet.</div></div>';
    var layer=document.getElementById('modal-layer');
    layer.innerHTML='<div id="modal-backdrop" style="position:fixed; inset:0; background:rgba(4,6,11,.7); display:flex; align-items:flex-start; justify-content:center; z-index:9999; padding:40px 16px; overflow-y:auto;">'
      + '<div class="card" style="width:100%; max-width:460px; padding:22px; background:var(--card);">'
      + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">'
      + '<div class="disp" style="font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;">'+icon('bell',17,'var(--ink)',1.8)+'Notifications</div>'
      + '<button class="btn btn-sm" id="notif-close-btn">Close</button></div>'
      + '<div style="max-height:52vh; overflow-y:auto;">'+listHtml+'</div>'
      + (notifications.length?'<div style="display:flex; justify-content:flex-end; margin-top:14px;"><button class="btn btn-sm" id="notif-clear-btn">Clear all</button></div>':'')
      + '</div></div>';
    document.getElementById('notif-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', function(e){ if(e.target.id==='modal-backdrop') closeModal(); });
    var clr=document.getElementById('notif-clear-btn');
    if(clr) clr.addEventListener('click', async function(){
      await api('/api/notifications/read', { method:'POST', body: JSON.stringify({clear:true}) });
      notifications=[]; renderBell(); closeModal();
    });
  }

  var NAV_TABS = [
    { tab:'countries', view:'countries-view', btn:'nav-countries-btn' },
    { tab:'table',     view:'table-view',     btn:'nav-table-btn' },
    { tab:'library',   view:'library-view',   btn:'nav-library-btn' }
  ];
  function setNav(tab){
    currentTab=tab;
    NAV_TABS.forEach(function(t){
      document.getElementById(t.view).style.display = (tab===t.tab) ? 'block' : 'none';
      document.getElementById(t.btn).className = (tab===t.tab) ? 'nav-btn btn-active' : 'nav-btn';
    });
    // The library is about records, not reporting — the spend summary above it would just be
    // noise, and its date range doesn't apply to anything the tab shows.
    document.getElementById('home-summary').style.display = (tab==='library') ? 'none' : 'block';
    renderAll();
  }

  document.getElementById('hero-eyebrow').innerHTML = icon('spark',13,'#fff',2) + '<span>Creative pipeline</span>';
  document.getElementById('nav-bell-btn').innerHTML = icon('bell',17,'#fff',1.9) + '<span id="bell-badge" style="position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#FF5C61; color:#fff; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; line-height:1;">0</span>';
  document.getElementById('nav-bell-btn').addEventListener('click', openNotifModal);
  document.getElementById('add-country-btn').addEventListener('click', function(){ openCountryModal(null); });
  document.getElementById('nav-countries-btn').addEventListener('click', function(){ setNav('countries'); });
  document.getElementById('nav-table-btn').addEventListener('click', function(){ setNav('table'); });
  document.getElementById('nav-library-btn').addEventListener('click', function(){ setNav('library'); });
  document.getElementById('f-search').addEventListener('input', renderAll);
  document.getElementById('f-status').addEventListener('change', renderAll);
  document.addEventListener('click', function(){ if(calendarOpen){ calendarOpen=false; renderDateFilter(); } });

  // The sync writes new numbers every 2 hours; a tab left open all day would otherwise keep showing
  // whatever was true when it was loaded. Half-cycle polling so a page is never more than an hour
  // behind the database regardless of where in the cycle it was opened. Skipped while a modal is
  // open — re-rendering underneath someone mid-edit would throw away what they'd typed.
  var AUTO_REFRESH_MS = 60*60*1000;
  setInterval(function(){
    if(document.hidden) return;
    if(document.getElementById('modal-layer').innerHTML) return;
    reloadForDateRange().catch(function(){});
    refreshNotifications().catch(function(){});
    refreshSyncHealth();
  }, AUTO_REFRESH_MS);

  setNav('countries');
  load();
  refreshSyncHealth();
})();
</script>
</div>
</div>
