<style>
  #app-root {
    --bg:#0B0E14; --card:#161B27; --panel:#12161F; --line:#28303F; --line-soft:#1E2532;
    --ink:#E8EBF3; --muted:#9BA6BC; --faint:#5E677B;
    --indigo:#6D7BFF; --indigo-strong:#5563E8; --indigo-tint:rgba(109,123,255,.16);
    --coral:#FF7A6E; --coral-tint:rgba(255,122,110,.15);
    --amber:#FBBF3B; --amber-tint:rgba(251,191,59,.15);
    --emerald:#2DD4A0; --emerald-tint:rgba(45,212,160,.15);
    --violet:#9B87FF; --violet-tint:rgba(155,135,255,.16);
    --sky:#45B8ED; --sky-tint:rgba(69,184,237,.15);
    --rose:#F472B6; --rose-tint:rgba(244,114,182,.15);
    --linkedin:#2D9CDB; --danger:#FF5C61; --danger-tint:rgba(255,92,97,.15);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--ink); max-width:1180px; margin:0 auto; padding:0 14px 60px;
  }
  #app-root * { box-sizing:border-box; }
  #app-root .disp { font-family:'Bricolage Grotesque','Inter',sans-serif; }
  #app-root svg { display:block; }

  #app-root .btn { font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:#1A2030; cursor:pointer; color:var(--ink); transition:background .12s, border-color .12s, transform .06s; }
  #app-root .btn:hover { background:#232B3C; }
  #app-root .btn:active { transform:translateY(1px); }
  #app-root .btn-sm { padding:5px 11px; font-size:12px; }
  #app-root .btn-primary { background:var(--indigo); border-color:var(--indigo); color:#fff; }
  #app-root .btn-primary:hover { background:var(--indigo-strong); }
  #app-root .btn-active { background:var(--indigo); color:#fff; border-color:var(--indigo); }

  #app-root select, #app-root input, #app-root textarea { font-family:inherit; font-size:13px; padding:8px 11px; border-radius:10px; border:1px solid var(--line); color:var(--ink); background:#10141E; width:100%; }
  #app-root select:focus, #app-root input:focus, #app-root textarea:focus { outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(109,123,255,.20); }
  #app-root input::placeholder, #app-root textarea::placeholder { color:var(--faint); }

  #app-root .card { background:var(--card); border:1px solid var(--line); border-radius:16px; }
  #app-root .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  #app-root .chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:4px 10px; border-radius:8px; background:#1C2230; color:var(--muted); white-space:nowrap; }
  #app-root .chip b { color:var(--ink); font-weight:700; }
  #app-root .flag { font-size:20px; line-height:1; }
  #app-root .nav-btn { font-family:inherit; font-size:13px; font-weight:600; padding:9px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.14); cursor:pointer; color:#fff; }
  #app-root .nav-btn.btn-active { background:#fff; color:var(--indigo-strong); border-color:#fff; }
  #app-root .scroll-x { overflow-x:auto; }
  #app-root .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 9px; display:flex; align-items:center; gap:7px; }

  #app-root .icobox { display:flex; align-items:center; justify-content:center; flex:none; }
  #app-root .type-tile { width:36px; height:36px; border-radius:10px; }
  #app-root .stat-icon { width:40px; height:40px; border-radius:12px; }
  #app-root .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  #app-root .asset-card { transition:box-shadow .14s, transform .08s, border-color .14s; }
  #app-root .asset-card:hover { box-shadow:0 10px 26px -14px rgba(0,0,0,.8); transform:translateY(-1px); border-color:#38425A; }
  #app-root .barwrap { display:flex; height:7px; border-radius:999px; overflow:hidden; background:var(--line-soft); }
  #app-root .barseg { height:100%; }
  #app-root .meta { display:inline-flex; align-items:center; gap:5px; }
  #app-root .perf-tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  #app-root .perf-tile .v { font-family:'Bricolage Grotesque','Inter',sans-serif; font-weight:700; font-size:16px; margin-top:2px; }
  #app-root .perf-tile .l { font-size:10.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  #app-root a { color:var(--indigo); }

  #app-root .tab-thumb-swiper { margin-bottom:10px; }
  #app-root .tab-thumb-swiper, #app-root .tab-thumb-swiper .swiper-wrapper { height:auto; }
  #app-root .tab-thumb-swiper .swiper-slide { width:auto; height:auto; }
  #app-root .tab-pill { font-family:inherit; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:#161B27; color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .12s, color .12s, border-color .12s; }
  #app-root .tab-pill-count { font-size:10.5px; font-weight:700; color:var(--faint); background:#0E121B; padding:1px 6px; border-radius:999px; }
  #app-root .swiper-slide-thumb-active .tab-pill { background:var(--indigo); border-color:var(--indigo); color:#fff; }
  #app-root .swiper-slide-thumb-active .tab-pill-count { background:rgba(255,255,255,.22); color:#fff; }
  #app-root .tab-main-swiper .swiper-slide { height:auto; max-height:520px; overflow-y:auto; }

  @keyframes appfade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }
  #app-root .fadein { animation:appfade .35s ease both; }
  @media (prefers-reduced-motion: reduce){ #app-root .fadein { animation:none; } }
  @media (max-width:760px){ #app-root #stats-row { grid-template-columns:repeat(2,1fr) !important; } }
</style>

<script>
(function(){
  var ICONS = {
    spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>',
    video:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/>',
    carousel:'<rect x="3" y="4" width="7" height="16" rx="1.6"/><rect x="14" y="4" width="7" height="16" rx="1.6"/>',
    document:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h5"/>',
    copy:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    stack:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    calendar:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
    folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    ext:'<path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
    inbox:'<path d="M3 12l3-7h12l3 7"/><path d="M3 12v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6"/><path d="M3 12h5l2 3h4l2-3h5"/>',
    chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M13 16V8M18 16v-6"/>',
    dollar:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.5 9.4c0-1.1-1.1-1.9-2.5-1.9s-2.5.8-2.5 1.9 1.1 1.7 2.5 2 2.5.8 2.5 2-1.1 1.9-2.5 1.9-2.5-.8-2.5-1.9"/>',
    magnet:'<circle cx="9" cy="8" r="4"/><path d="M2.5 21c0-3.8 3.2-5.6 6.5-5.6"/><path d="M17 8v6M14 11h6"/>',
    funnel:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',
    target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
    caretDown:'<path d="M6 9l6 6 6-6"/>',
    caretRight:'<path d="M9 6l6 6-6 6"/>',
    bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'
  };
  function icon(name, size, color, sw){
    size=size||18;
    return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="'+(sw||1.7)+'" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
  }

  var STATUS_LIST = ["Requested","Briefed","In Progress","In Review","Revisions Needed","Approved","Delivered","Live on LinkedIn","Archived"];
  var STATUS_COLOR = {
    "Requested":        {bg:"rgba(148,163,184,.16)", fg:"#B4BECF", solid:"#7A879C"},
    "Briefed":          {bg:"var(--sky-tint)",       fg:"#7FD0F5", solid:"#45B8ED"},
    "In Progress":      {bg:"var(--indigo-tint)",    fg:"#AAB2FF", solid:"#6D7BFF"},
    "In Review":        {bg:"var(--amber-tint)",     fg:"#F6C860", solid:"#FBBF3B"},
    "Revisions Needed": {bg:"var(--rose-tint)",      fg:"#F79FCB", solid:"#F472B6"},
    "Approved":         {bg:"var(--emerald-tint)",   fg:"#6EE7C0", solid:"#37D9A6"},
    "Delivered":        {bg:"var(--emerald-tint)",   fg:"#34D399", solid:"#22C29A"},
    "Live on LinkedIn": {bg:"var(--linkedin)",       fg:"#ffffff", solid:"#2D9CDB"},
    "Archived":         {bg:"rgba(120,130,150,.16)", fg:"#97A0B4", solid:"#6B7488"}
  };
  var TYPE_LIST = ["Image","Video","Carousel","Document","Copy-only"];
  var TYPE_CFG = {
    "Image":     {ic:"image",    color:"var(--sky)",     tint:"var(--sky-tint)"},
    "Video":     {ic:"video",    color:"var(--coral)",   tint:"var(--coral-tint)"},
    "Carousel":  {ic:"carousel", color:"var(--violet)",  tint:"var(--violet-tint)"},
    "Document":  {ic:"document", color:"var(--emerald)", tint:"var(--emerald-tint)"},
    "Copy-only": {ic:"copy",     color:"var(--amber)",   tint:"var(--amber-tint)"}
  };
  var FLAGS = { "UAE":"🇦🇪","Germany":"🇩🇪","Oman":"🇴🇲","Philippines":"🇵🇭","India":"🇮🇳","Global":"🌐" };
  var ACCENTS = ["#6D7BFF","#FF7A6E","#2DD4A0","#9B87FF","#45B8ED","#FBBF3B","#F472B6"];
  var COUNTRY_ACCENT = { "UAE":"#2DD4A0","Germany":"#FBBF3B","Oman":"#9B87FF","Philippines":"#45B8ED","India":"#FF7A6E","Global":"#6D7BFF" };
  var METRIC_FIELDS = ["spend","impressions","clicks","reach","leads"];

  var assets = [], countries = [], campaigns = [], notifications = [], expanded = {}, currentTab = "countries";
  var activeAssetTab = {}, tabMainSwipers = {}, tabThumbSwipers = {};

  function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function flagFor(n){ return FLAGS[n] || "🌐"; }
  function accentFor(n){ if(COUNTRY_ACCENT[n]) return COUNTRY_ACCENT[n]; var h=0; for(var i=0;i<(n||"").length;i++) h=(h*31+n.charCodeAt(i))>>>0; return ACCENTS[h%ACCENTS.length]; }
  function num(v){ return Number(v)||0; }
  function fmtInt(v){ return Math.round(num(v)).toLocaleString(); }
  function fmtMoney(v){ return "₹"+Math.round(num(v)).toLocaleString(); }
  function fmtPct(v){ return (Math.round(num(v)*100)/100).toFixed(2)+"%"; }
  function fmtDec(v){ return "₹"+(Math.round(num(v)*100)/100).toFixed(2); }
  function fmtDate(d){ if(!d) return ""; var dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
  function isoToday(){ return new Date().toISOString().slice(0,10); }

  // ---- backend API ----
  async function api(path, opts){
    var res = await fetch(path, Object.assign({ headers:{ 'Content-Type':'application/json' } }, opts||{}));
    if(!res.ok){
      var body=null; try{ body=await res.json(); }catch(e){}
      throw new Error((body&&body.error)||('Request failed: '+res.status));
    }
    if(res.status===204) return null;
    return res.json();
  }

  function mapMarketFromApi(m){ return { id:m.id, country:m.name, pocName:m.poc_name||'', channel:m.channel||'', link:m.drive_folder_link||'', notes:m.notes||'' }; }
  function marketToApiBody(vals){ return { name:vals.country, pocName:vals.pocName, channel:vals.channel, driveFolderLink:vals.link, notes:vals.notes }; }
  function mapCampaignFromApi(c){
    return {
      id:c.id, name:c.name, marketId:c.market_id, marketName:c.market_name||'', liCampaignId:c.li_campaign_id||'',
      spend:num(c.spend), impressions:num(c.impressions), clicks:num(c.clicks), reach:num(c.reach), leads:num(c.leads),
      metricsSource:c.metrics_source||''
    };
  }
  function mapAssetFromApi(a){
    return {
      id:a.id, title:a.title, type:a.type, marketId:a.market_id, market:a.market_name,
      campaignId:a.campaign_id, campaign:a.campaign_name||'', liCampaignId:a.li_campaign_id||'',
      assignedTo:a.assigned_to||'', dueDate:a.due_date?String(a.due_date).slice(0,10):'',
      status:a.status, dateDelivered:a.date_delivered?String(a.date_delivered).slice(0,10):'',
      link:a.link||'', version:a.version||'v1', adCopyLink:a.ad_copy_link||'', creativeLink:a.creative_link||'',
      notes:a.notes||'', spend:num(a.spend), impressions:num(a.impressions), clicks:num(a.clicks),
      reach:num(a.reach), leads:num(a.leads), metricsSource:a.metrics_source||''
    };
  }
  function assetToApiBody(vals){
    return {
      title:vals.title, type:vals.type, marketId:vals.marketId, campaignId:vals.campaignId,
      assignedTo:vals.assignedTo, dueDate:vals.dueDate||null, status:vals.status,
      dateDelivered:vals.dateDelivered||null, link:vals.link, version:vals.version,
      adCopyLink:vals.adCopyLink, creativeLink:vals.creativeLink, notes:vals.notes
    };
  }
  function mapNotifFromApi(n){ return { id:n.id, to:n.to_name, title:n.asset_title, market:n.market_name, ts:new Date(n.created_at).getTime(), read:n.read }; }

  async function load(){
    try {
      var results = await Promise.all([api('/api/markets'), api('/api/campaigns'), api('/api/assets'), api('/api/notifications')]);
      countries = results[0].map(mapMarketFromApi);
      campaigns = results[1].map(mapCampaignFromApi);
      assets = results[2].map(mapAssetFromApi);
      notifications = results[3].map(mapNotifFromApi);
    } catch(e){
      console.error('Failed to load from API', e);
      showToast('Could not reach the backend API — check it is deployed and reachable.');
      countries=[]; campaigns=[]; assets=[]; notifications=[];
    }
    countries.forEach(function(c){ if(expanded[c.id]===undefined) expanded[c.id]=true; });
    renderAll(); renderBell();
  }
  async function refreshAssets(){ var rows=await api('/api/assets'); assets=rows.map(mapAssetFromApi); renderAll(); }
  async function refreshCampaigns(){ var rows=await api('/api/campaigns'); campaigns=rows.map(mapCampaignFromApi); renderAll(); }
  async function refreshNotifications(){ var rows=await api('/api/notifications'); notifications=rows.map(mapNotifFromApi); renderBell(); }
  async function resolveCampaignId(marketId, name){
    if(!name) return null;
    var existing = campaigns.find(function(c){ return c.marketId===marketId && c.name.toLowerCase()===name.toLowerCase(); });
    if(existing) return existing.id;
    var created = await api('/api/campaigns', { method:'POST', body: JSON.stringify({ name:name, marketId:marketId }) });
    var mapped = mapCampaignFromApi(created);
    campaigns.push(mapped);
    return mapped.id;
  }

  function isOverdue(a){ if(a.dateDelivered) return false; if(["Delivered","Live on LinkedIn","Archived"].indexOf(a.status)!==-1) return false; if(!a.dueDate) return false; var t=new Date(); t.setHours(0,0,0,0); return new Date(a.dueDate)<t; }
  function derived(a){ var im=num(a.impressions),cl=num(a.clicks),sp=num(a.spend),le=num(a.leads); return { ctr:im>0?cl/im*100:0, cpc:cl>0?sp/cl:0, cpm:im>0?sp/im*1000:0, cpl:le>0?sp/le:0 }; }
  // Several creative assets can share one LinkedIn campaign, and metrics only exist at campaign
  // granularity — so totals are summed per unique campaign, not per asset, to avoid double-counting.
  function totalsFor(list){
    var seen={}; var t={spend:0,impressions:0,clicks:0,reach:0,leads:0};
    list.forEach(function(a){
      if(!a.campaignId || seen[a.campaignId]) return;
      seen[a.campaignId]=true;
      METRIC_FIELDS.forEach(function(f){ t[f]+=num(a[f]); });
    });
    return t;
  }

  function renderStats(){
    var overdue=assets.filter(isOverdue).length;
    var live=assets.filter(function(a){return a.status==="Live on LinkedIn";}).length;
    var delivered=assets.filter(function(a){return a.status==="Delivered";}).length;
    var cards=[
      {label:"Total assets", value:assets.length, ic:"stack", color:"var(--indigo)", tint:"var(--indigo-tint)"},
      {label:"Overdue", value:overdue, ic:"clock", color: overdue>0?"var(--danger)":"var(--muted)", tint:"var(--danger-tint)"},
      {label:"Delivered", value:delivered, ic:"check", color:"var(--emerald)", tint:"var(--emerald-tint)"},

  function populateStatusFilter(){ var fs=document.getElementById('f-status'); var cur=fs.value; fs.innerHTML='<option value="">All statuses</option>'+STATUS_LIST.map(function(v){return '<option value="'+v+'">'+v+'</option>';}).join(''); fs.value=cur; }
  function matchesFilter(a){ var q=document.getElementById('f-search').value.toLowerCase(); var s=document.getElementById('f-status').value; if(s&&a.status!==s) return false; if(q&&a.title.toLowerCase().indexOf(q)===-1&&a.campaign.toLowerCase().indexOf(q)===-1) return false; return true; }

  function statusBar(list){
    if(!list.length) return '';
    var counts={}; list.forEach(function(a){ counts[a.status]=(counts[a.status]||0)+1; });
    var segs=STATUS_LIST.filter(function(s){return counts[s];}).map(function(s){ return '<div class="barseg" title="'+s+': '+counts[s]+'" style="width:'+(counts[s]/list.length*100)+'%; background:'+STATUS_COLOR[s].solid+';"></div>'; }).join('');
    return '<div class="barwrap" style="margin-top:12px;">'+segs+'</div>';
  }

  function typeTile(type){ var c=TYPE_CFG[type]||{ic:"document",color:"var(--muted)",tint:"#1C2230"}; return '<div class="icobox type-tile" style="background:'+c.tint+'; color:'+c.color+';">'+icon(c.ic,19,'currentColor',1.8)+'</div>'; }

  function perfPanel(list){
    var t=totalsFor(list);
    var head='<div class="section-title" style="margin:0 0 10px;">'+icon('chart',14,'var(--muted)',1.8)+' Ad performance <span style="color:var(--faint); font-weight:600; text-transform:none; letter-spacing:0;">· current month · '+list.length+' assets</span></div>';
    var grid=metricList(t).map(function(x){ return '<div class="perf-tile"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'; }).join('');
    return '<div style="background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:13px;">'+head
      + '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;">'+grid+'</div></div>';
  }
  function renderOverall(){
    var heads=['Country','Cost','Clicks','Impr','CPC','Reach','Leads'];
    var rows=countries.map(function(c){
      var list=assets.filter(function(a){return a.marketId===c.id;});
      var t=totalsFor(list);
      var accent=accentFor(c.country);
      var cells=metricList(t).map(function(x){ return '<td style="padding:10px 12px; text-align:right;">'+x[1]+'</td>'; }).join('');
      return '<tr style="border-bottom:1px solid var(--line-soft);">'
        + '<td style="padding:10px 12px; white-space:nowrap;"><span class="meta"><span class="dot" style="background:'+accent+';"></span>'+flagFor(c.country)+' <b style="font-weight:600;">'+esc(c.country)+'</b> <span style="color:var(--faint); font-weight:600; margin-left:2px;">'+list.length+'</span></span></td>'
        + cells + '</tr>';
    }).join('');
    document.getElementById('overall-perf').innerHTML =
      '<div class="card fadein" style="padding:15px 17px;">'
      + '<div class="section-title" style="margin:0 0 11px;">'+icon('chart',14,'var(--indigo)',1.8)+' Performance by country <span style="color:var(--faint); font-weight:600; text-transform:none; letter-spacing:0;">· current month · '+countries.length+' markets</span></div>'
      + '<div class="scroll-x"><table style="width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px;">'
      + '<thead><tr style="border-bottom:1px solid var(--line);">'
      + heads.map(function(h,i){ return '<th style="text-align:'+(i===0?'left':'right')+'; padding:8px 12px; font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;">'+h+'</th>'; }).join('')
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="7" style="padding:20px; text-align:center; color:var(--faint);">No countries yet</td></tr>')+'</tbody></table></div>'
      + '</div>';
  }

  function metricList(o){
    var d=derived(o);
    return [['cost',fmtMoney(o.spend)],['clicks',fmtInt(o.clicks)],['impr',fmtInt(o.impressions)],['cpc',fmtDec(d.cpc)],['reach',fmtInt(o.reach)],['leads',fmtInt(o.leads)]];
  }
  function metricChips(a){
    return '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">'
      + metricList(a).map(function(x){ return '<span class="chip"><b>'+x[1]+'</b> '+x[0]+'</span>'; }).join('') + '</div>';
  }

  function assetRowHtml(a){
    var overdue=isOverdue(a);
    var col=STATUS_COLOR[a.status]||STATUS_COLOR["Requested"];
    return '<div class="card asset-card fadein" data-id="'+a.id+'" style="padding:13px 15px; margin-bottom:9px; cursor:pointer; border-color:'+(overdue?'rgba(255,92,97,.55)':'var(--line)')+';">'
      + '<div style="display:flex; gap:12px; align-items:flex-start;">'
      + typeTile(a.type)
      + '<div style="flex:1; min-width:0;">'
      + '<div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap;">'
      + '<div style="min-width:180px; flex:1;"><div style="font-size:13.5px; font-weight:600; line-height:1.25;">'+esc(a.title)+'</div>'
      + '<div style="font-size:11.5px; color:var(--muted); margin-top:4px;">'+esc(a.campaign||'—')+'</div></div>'
      + '<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">'
      + '<span class="badge" style="background:'+col.bg+'; color:'+col.fg+';">'+a.status+'</span>'
      + (overdue?'<span class="badge" style="background:var(--danger-tint); color:var(--danger);">'+icon('clock',12,'currentColor',2)+' Overdue</span>':'')
      + '</div></div>'

      + (a.dueDate?'<span class="meta">'+icon('calendar',13,'var(--faint)',1.8)+fmtDate(a.dueDate)+'</span>':'')
      + (a.version?'<span class="chip">'+esc(a.version)+'</span>':'')
      + (a.link?'<a href="'+esc(a.link)+'" target="_blank" rel="noopener" class="meta" style="margin-left:auto; text-decoration:none; font-weight:600;" onclick="event.stopPropagation();">'+icon('folder',13,'currentColor',1.8)+'Asset</a>':'')
      + (a.adCopyLink?'<a href="'+esc(a.adCopyLink)+'" target="_blank" rel="noopener" class="meta" style="'+(a.link?'':'margin-left:auto; ')+'color:var(--amber); text-decoration:none; font-weight:600;" onclick="event.stopPropagation();">'+icon('copy',13,'currentColor',1.8)+'Ad copy</a>':'')
      + (a.creativeLink?'<a href="'+esc(a.creativeLink)+'" target="_blank" rel="noopener" class="meta" style="'+((a.link||a.adCopyLink)?'':'margin-left:auto; ')+'color:var(--violet); text-decoration:none; font-weight:600;" onclick="event.stopPropagation();">'+icon('image',13,'currentColor',1.8)+'Creatives</a>':'')
      + '</div>'
      + metricChips(a)
      + '</div></div></div>';
  }

  function campaignsForMarket(marketId){ return campaigns.filter(function(c){return c.marketId===marketId;}); }
  function campaignMetricsRow(c){
    return { spend:c.spend, impressions:c.impressions, clicks:c.clicks, reach:c.reach, leads:c.leads, source:c.metricsSource };
  }
  function campaignsPanelHtml(c){
    var list = campaignsForMarket(c.id);
    var rows = list.map(function(cam){
      var m = campaignMetricsRow(cam);
      return '<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line-soft); flex-wrap:wrap;">'
        + '<div style="flex:1; min-width:160px;"><div style="font-size:12.5px; font-weight:600;">'+esc(cam.name)+'</div>'
        + '<div style="font-size:11px; color:var(--faint);">'+(cam.liCampaignId?esc(cam.liCampaignId):'No LinkedIn campaign ID yet')+(m.source?' · '+(m.source==='sync'?'synced':'manual'):'')+'</div></div>'
        + '<span class="chip"><b>'+fmtMoney(m.spend)+'</b> spend</span>'
        + '<span class="chip"><b>'+fmtInt(m.leads)+'</b> leads</span>'
        + '<button class="btn btn-sm log-metrics-btn" data-campaign="'+cam.id+'" data-campaign-name="'+esc(cam.name)+'">Log numbers</button>'
        + '<button class="btn btn-sm edit-campaign-btn" data-campaign="'+cam.id+'">Edit</button>'

      + '<div style="display:flex; justify-content:flex-end; margin-bottom:'+(rows?'8px':'0')+';">'
      + '<button class="btn btn-sm add-campaign-btn" data-market="'+c.id+'">+ Campaign</button>'
      + '</div>'
      + (rows || '<div style="font-size:12px; color:var(--faint);">No campaigns yet for this market.</div>')
      + '</div>';

  function assetsPanelHtml(c, filtered, list){
    return '<div style="background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px;">'
      + (c.link?'<div style="font-size:11.5px; color:var(--muted); margin-bottom:11px;" class="meta">'+icon('folder',13,'var(--faint)',1.8)+'<a href="'+esc(c.link)+'" target="_blank" rel="noopener">Shared folder</a> · via '+esc(c.channel||'—')+'</div>':'')
      + (filtered.length ? filtered.map(assetRowHtml).join('')
          : '<div style="text-align:center; padding:22px 8px; color:var(--faint);"><div class="icobox" style="justify-content:center;">'+icon(list.length?'search':'inbox',26,'var(--faint)',1.6)+'</div><div style="font-size:12.5px; margin-top:8px;">'+(list.length?'No assets match the current filter.':'No assets yet. Hit “+ Asset” to log the first one.')+'</div></div>')
      + '</div>';
  }

  function tabsHtml(c, list, filtered){
    var campaignCount = campaignsForMarket(c.id).length;
    return '<div class="swiper tab-thumb-swiper" data-id="'+c.id+'">'
      + '<div class="swiper-wrapper">'
      + '<div class="swiper-slide"><button type="button" class="tab-pill">'+icon('target',13,'currentColor',1.8)+'Campaigns <span class="tab-pill-count">'+campaignCount+'</span></button></div>'
      + '<div class="swiper-slide"><button type="button" class="tab-pill">'+icon('stack',13,'currentColor',1.8)+'Assets <span class="tab-pill-count">'+list.length+'</span></button></div>'
      + '</div></div>'
      + '<div class="swiper tab-main-swiper" data-id="'+c.id+'">'
      + '<div class="swiper-wrapper">'
      + '<div class="swiper-slide">'+campaignsPanelHtml(c)+'</div>'
      + '<div class="swiper-slide">'+assetsPanelHtml(c, filtered, list)+'</div>'
      + '</div></div>';
  }

  function countryBlockHtml(c){
    var accent=accentFor(c.country);
    var list=assets.filter(function(a){return a.marketId===c.id;});
    var filtered=list.filter(matchesFilter);
    var isOpen=expanded[c.id]!==false;
    var live=list.filter(function(a){return a.status==="Live on LinkedIn";}).length;
    var overdue=list.filter(isOverdue).length;
    var t=totalsFor(list);
    return '<div class="card fadein" style="margin-bottom:15px; overflow:hidden; border-left:5px solid '+accent+';">'
      + '<div class="country-header" data-id="'+c.id+'" style="padding:15px 17px; cursor:pointer; display:flex; align-items:center; gap:13px; flex-wrap:wrap; background:linear-gradient(90deg,'+accent+'22 0%, transparent 60%);">'
      + '<span class="flag icobox" style="width:40px; height:40px; border-radius:11px; background:#10141E; border:1px solid var(--line);">'+flagFor(c.country)+'</span>'
      + '<div style="min-width:150px;"><div class="disp" style="font-size:16px; font-weight:700;">'+esc(c.country)+'</div>'
      + '<div style="font-size:11.5px; color:var(--muted);">'+esc(c.pocName||'—')+'</div></div>'
      + '<div style="display:flex; gap:6px; flex-wrap:wrap; flex:1;">'
      + '<span class="chip"><b>'+list.length+'</b> assets</span>'
      + '<span class="chip" style="background:var(--emerald-tint); color:#6EE7C0;">'+icon('dollar',12,'currentColor',1.8)+'<b>'+fmtMoney(t.spend)+'</b></span>'
      + '<span class="chip" style="background:var(--indigo-tint); color:#AAB2FF;">'+icon('magnet',12,'currentColor',1.8)+'<b>'+fmtInt(t.leads)+'</b> leads</span>'
      + '<span class="chip" style="background:var(--sky-tint); color:#7FD0F5;">'+icon('send',12,'currentColor',1.8)+'<b>'+live+'</b> live</span>'
      + (overdue?'<span class="chip" style="background:var(--danger-tint); color:var(--danger);">'+icon('clock',12,'currentColor',1.8)+'<b>'+overdue+'</b> overdue</span>':'')
      + '</div>'
      + '<div style="display:flex; gap:6px; align-items:center;">'
      + '<button class="btn btn-sm edit-country-btn" data-id="'+c.id+'">Edit POC</button>'
      + '<button class="btn btn-sm btn-primary add-asset-btn" data-market="'+c.id+'">+ Asset</button>'
      + '<span class="icobox" style="color:var(--faint); padding:0 2px;">'+icon(isOpen?'caretDown':'caretRight',18,'currentColor',2)+'</span>'
      + '</div>'
      + statusBar(list)
      + '</div>'
      + '<div style="padding:'+(isOpen?'15px 17px':'0')+'; display:'+(isOpen?'block':'none')+';">'
      + perfPanel(list)
      + tabsHtml(c, list, filtered)
      + '</div></div>';
  }

  function renderCountryBlocks(){
    document.getElementById('country-blocks').innerHTML = countries.map(countryBlockHtml).join('') || '<div style="color:var(--faint); font-size:13px;">No countries yet.</div>';
    document.querySelectorAll('.country-header').forEach(function(el){ el.addEventListener('click', function(e){ if(e.target.closest('.edit-country-btn')||e.target.closest('.add-asset-btn')||e.target.closest('a')) return; var id=el.getAttribute('data-id'); expanded[id]=!(expanded[id]!==false); renderCountryBlocks(); }); });
    document.querySelectorAll('.edit-country-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openCountryModal(Number(el.getAttribute('data-id'))); }); });
    document.querySelectorAll('.add-asset-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openAssetModal(null, Number(el.getAttribute('data-market'))); }); });
    document.querySelectorAll('.asset-card').forEach(function(el){ el.addEventListener('click', function(){ openAssetModal(Number(el.getAttribute('data-id'))); }); });
    document.querySelectorAll('.log-metrics-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openMetricsModal(Number(el.getAttribute('data-campaign')), el.getAttribute('data-campaign-name')); }); });
    document.querySelectorAll('.edit-campaign-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openCampaignModal(Number(el.getAttribute('data-campaign'))); }); });
    document.querySelectorAll('.add-campaign-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openCampaignModal(null, Number(el.getAttribute('data-market'))); }); });
    initCountryTabSwipers();
  }

  function initCountryTabSwipers(){
    Object.keys(tabMainSwipers).forEach(function(id){ try{ tabMainSwipers[id].destroy(true,true); }catch(e){} });
    Object.keys(tabThumbSwipers).forEach(function(id){ try{ tabThumbSwipers[id].destroy(true,true); }catch(e){} });
    tabMainSwipers = {}; tabThumbSwipers = {};
    if(typeof Swiper === 'undefined') return;
    countries.forEach(function(c){
      if(expanded[c.id] === false) return;
      var thumbEl = document.querySelector('.tab-thumb-swiper[data-id="'+c.id+'"]');
      var mainEl = document.querySelector('.tab-main-swiper[data-id="'+c.id+'"]');
      if(!thumbEl || !mainEl) return;
      var startSlide = activeAssetTab[c.id] || 0;
      var thumbSwiper = new Swiper(thumbEl, { slidesPerView:'auto', spaceBetween:8, watchSlidesProgress:true, freeMode:true, initialSlide:startSlide });
      var mainSwiper = new Swiper(mainEl, {
        slidesPerView:1, autoHeight:true, allowTouchMove:true, initialSlide:startSlide,
        thumbs:{ swiper:thumbSwiper },
        on:{ slideChange:function(sw){ activeAssetTab[c.id]=sw.activeIndex; } }
      });
      tabThumbSwipers[c.id]=thumbSwiper; tabMainSwipers[c.id]=mainSwiper;
    });
  }

      var overdue=isOverdue(a); var d=derived(a);

      return '<tr class="table-row" data-id="'+a.id+'" style="cursor:pointer; border-bottom:1px solid var(--line-soft);">'
        + '<td style="padding:11px 12px;">'+flagFor(a.market)+' '+esc(a.market)+'</td>'
        + '<td style="padding:11px 12px; font-weight:600;">'+esc(a.title)+'</td>'
        + '<td style="padding:11px 12px;"><span class="meta" style="color:'+cfg.color+';">'+icon(cfg.ic,14,'currentColor',1.8)+'<span style="color:var(--ink);">'+esc(a.type)+'</span></span></td>'
        + '<td style="padding:11px 12px;"><span class="badge" style="background:'+col.bg+'; color:'+col.fg+';">'+a.status+'</span>'+(overdue?' <span class="badge" style="background:var(--danger-tint); color:var(--danger);">Late</span>':'')+'</td>'

        + '<td style="padding:11px 12px; text-align:right;">'+fmtInt(a.clicks)+'</td>'

        + '<td style="padding:11px 12px; text-align:right;">'+fmtDec(d.cpc)+'</td>'

    document.getElementById('table-view').innerHTML =
      '<div class="card scroll-x fadein" style="padding:0; overflow:hidden;">'
      + '<table style="width:100%; border-collapse:collapse; font-size:12.5px; min-width:980px;">'
      + '<thead><tr style="background:#12161F; border-bottom:1px solid var(--line);">'
      + headers.map(function(h){ return '<th style="text-align:'+(h[1]?'right':'left')+'; padding:11px 12px; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;">'+h[0]+'</th>'; }).join('')
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="12" style="padding:26px; text-align:center; color:var(--faint);">No assets match these filters</td></tr>')+'</tbody></table></div>';
    document.querySelectorAll('#table-view .table-row').forEach(function(el){ el.addEventListener('click', function(){ openAssetModal(Number(el.getAttribute('data-id'))); }); });
  }

  function renderAll(){ renderStats(); renderOverall(); populateStatusFilter(); if(currentTab==='countries') renderCountryBlocks(); else renderTableView(); }

  function field(l,h){ return '<div style="margin-bottom:13px;"><label>'+l+'</label>'+h+'</div>'; }

      + field('Assigned to (content)','<input id="m-assignedto" value="'+esc(a.assignedTo)+'" placeholder="Who is doing the work" />')
      + '<div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--indigo); margin:-6px 0 13px;">'+icon('bell',12,'currentColor',1.9)+'<span>The assignee is notified when you save.</span></div>'
      + field('Status','<select id="m-status">'+statusOpts+'</select>')
      + '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">'+field('Due date','<input id="m-duedate" type="date" value="'+esc(a.dueDate)+'" />')+field('Date delivered','<input id="m-delivered" type="date" value="'+esc(a.dateDelivered)+'" />')+'</div>'
      + field('Shared asset link','<input id="m-link" value="'+esc(a.link)+'" placeholder="https://drive.google.com/..." />')

      + field('Notes / feedback','<textarea id="m-notes" rows="2">'+esc(a.notes)+'</textarea>')
      + '<div class="section-title">'+icon('copy',13,'var(--muted)',1.8)+' Creatives</div>'
      + field('Ad copies link','<input id="m-adcopy" value="'+esc(a.adCopyLink)+'" placeholder="Doc with headlines &amp; body copy" />')
      + field('Creatives link','<input id="m-creative" value="'+esc(a.creativeLink)+'" placeholder="Folder with designs, video &amp; images" />')
      + '<div class="section-title">'+icon('chart',13,'var(--muted)',1.8)+' Ad performance (current month, campaign-level)</div>'
      + (id
          ? '<div style="display:flex; flex-wrap:wrap; gap:6px;">'+metricList(a).map(function(x){ return '<span class="chip"><b>'+x[1]+'</b> '+x[0]+'</span>'; }).join('')+'</div>'
            + '<div style="font-size:11px; color:var(--faint); margin-top:6px;">'+(a.metricsSource?('Source: '+(a.metricsSource==='sync'?'synced from LinkedIn':'manual entry')+' · '):'')+'Metrics are logged per campaign — use “Log numbers” on the campaign in the country view.</div>'
          : '<div style="font-size:11.5px; color:var(--faint);">Save the asset first, then log performance for its campaign from the country view.</div>');

    showModal(id?'Edit asset':'New asset', body, async function(){
      var prevAssignee = a.assignedTo || '';
      var marketId = Number(document.getElementById('m-market').value) || null;
      var campaignName = v('m-campaign');
      if(!v('m-title')){ showToast('Give the asset a title.'); return false; }
      if(!marketId){ showToast('Select a country.'); return false; }
      var vals = {
        title: v('m-title'), type: document.getElementById('m-type').value, marketId: marketId,
        assignedTo: v('m-assignedto'),
        dueDate: document.getElementById('m-duedate').value, dateDelivered: document.getElementById('m-delivered').value,
        status: document.getElementById('m-status').value, link: v('m-link'), version: v('m-version'),
        adCopyLink: v('m-adcopy'), creativeLink: v('m-creative'), notes: v('m-notes')
      };
      vals.campaignId = await resolveCampaignId(marketId, campaignName);
      var payload = assetToApiBody(vals);
      var saved = id
        ? await api('/api/assets/'+id, { method:'PUT', body: JSON.stringify(payload) })
        : await api('/api/assets', { method:'POST', body: JSON.stringify(payload) });
      var mapped = mapAssetFromApi(saved);
      if(id){ var idx=assets.findIndex(function(x){return x.id===id;}); assets[idx]=mapped; }
      else { assets.push(mapped); }
      renderAll();
      if(mapped.assignedTo && mapped.assignedTo!==prevAssignee){
        await refreshNotifications();
        showToast(icon('bell',14,'#fff',2)+' '+esc(mapped.assignedTo)+' notified — assigned “'+esc(mapped.title)+'”');
      }
      return true;
    }, id?async function(){
      await api('/api/assets/'+id, { method:'DELETE' });
      assets=assets.filter(function(x){return x.id!==id;});
      renderAll();
      refreshNotifications();
    }:null);

    var marketSel = document.getElementById('m-market');
    function refreshCampaignDatalist(){
      var mid = Number(marketSel.value)||null;
      var dl = document.getElementById('m-campaign-list');
      dl.innerHTML = campaignsForMarket(mid).map(function(c){return '<option value="'+esc(c.name)+'"></option>';}).join('');
    }
    marketSel.addEventListener('change', refreshCampaignDatalist);
    refreshCampaignDatalist();
  }
  function v(id){ return document.getElementById(id).value.trim(); }

  function openCampaignModal(id, presetMarketId){
    var c = id ? campaigns.find(function(x){return x.id===id;}) : { name:'', liCampaignId:'', marketId: presetMarketId||null };
    var marketOpts = countries.slice().sort(function(x,y){return x.country.localeCompare(y.country);}).map(function(m){return '<option value="'+m.id+'" '+(c.marketId===m.id?'selected':'')+'>'+esc(m.country)+'</option>';}).join('');
    var body = field('Market','<select id="cm-market">'+marketOpts+'</select>')
      + field('Campaign name (must match Campaign Manager exactly)','<input id="cm-name" value="'+esc(c.name)+'" placeholder="UAE_EN - Compliance" />')
      + field('LinkedIn campaign ID','<input id="cm-liid" value="'+esc(c.liCampaignId)+'" placeholder="e.g. 123456789" />');
    showModal(id?'Edit campaign':'New campaign', body, async function(){
      var vals={ name:v('cm-name'), marketId:Number(document.getElementById('cm-market').value)||null, liCampaignId:v('cm-liid') };
      if(!vals.name){ showToast('Give the campaign a name.'); return false; }
      if(!vals.marketId){ showToast('Select a market.'); return false; }
      var payload = { name:vals.name, marketId:vals.marketId, liCampaignId: vals.liCampaignId || null };
      var saved = id
        ? await api('/api/campaigns/'+id, { method:'PUT', body: JSON.stringify(payload) })
        : await api('/api/campaigns', { method:'POST', body: JSON.stringify(payload) });
      var mapped = mapCampaignFromApi(saved);
      if(id){ var idx=campaigns.findIndex(function(x){return x.id===id;}); campaigns[idx]=mapped; } else { campaigns.push(mapped); }
      renderAll();
      return true;
    }, id?async function(){
      await api('/api/campaigns/'+id, { method:'DELETE' });
      campaigns=campaigns.filter(function(x){return x.id!==id;});
      await refreshAssets();
    }:null);
  }

  function openMetricsModal(campaignId, campaignName){
    var body = '<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">Logs a manual entry for <b>'+esc(campaignName)+'</b> — the next automatic sync will overwrite this day\'s numbers.</div>'
      + field('Date','<input id="mm-date" type="date" value="'+isoToday()+'" />')
      + '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">'+field('Spend (₹)','<input id="mm-spend" type="number" min="0" step="0.01" value="0" />')+field('Impressions','<input id="mm-impressions" type="number" min="0" step="1" value="0" />')+field('Clicks','<input id="mm-clicks" type="number" min="0" step="1" value="0" />')+'</div>'
      + '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">'+field('Reach','<input id="mm-reach" type="number" min="0" step="1" value="0" />')+field('Leads','<input id="mm-leads" type="number" min="0" step="1" value="0" />')+'</div>';
    showModal('Log metrics', body, async function(){
      await api('/api/metrics/manual', { method:'POST', body: JSON.stringify({
        campaignId: campaignId,
        date: document.getElementById('mm-date').value,
        spend: num(document.getElementById('mm-spend').value),
        impressions: num(document.getElementById('mm-impressions').value),
        clicks: num(document.getElementById('mm-clicks').value),
        reach: num(document.getElementById('mm-reach').value),
        leads: num(document.getElementById('mm-leads').value)
      }) });
      await Promise.all([refreshAssets(), refreshCampaigns()]);
      showToast('Metrics logged for '+esc(campaignName)+'.');
      return true;
    });
  }

  function openCountryModal(id){
    var c = id ? countries.find(function(x){return x.id===id;}) : { country:"", pocName:"", channel:"", link:"", notes:"" };
    var body=field('Country','<input id="c-country" value="'+esc(c.country)+'" placeholder="UAE" />')
      + field('POC name','<input id="c-pocname" value="'+esc(c.pocName)+'" placeholder="Full name" />')
      + field('Preferred sharing channel','<input id="c-channel" value="'+esc(c.channel)+'" placeholder="Slack #uae-content, Email, Teams..." />')
      + field('Shared asset folder link','<input id="c-link" value="'+esc(c.link)+'" placeholder="https://drive.google.com/..." />')
      + field('Notes','<textarea id="c-notes" rows="2">'+esc(c.notes)+'</textarea>');
    showModal(id?'Edit country':'Add country', body, async function(){
      var vals={ country:v('c-country'), pocName:v('c-pocname'), channel:v('c-channel'), link:v('c-link'), notes:v('c-notes') };
      if(!vals.country){ showToast('Give the country a name.'); return false; }
      var payload = marketToApiBody(vals);
      var saved = id
        ? await api('/api/markets/'+id, { method:'PUT', body: JSON.stringify(payload) })
        : await api('/api/markets', { method:'POST', body: JSON.stringify(payload) });
      var mapped = mapMarketFromApi(saved);
      if(id){ var idx=countries.findIndex(function(x){return x.id===id;}); countries[idx]=mapped; }
      else { expanded[mapped.id]=true; countries.push(mapped); }
      renderAll();
      return true;
    }, id?async function(){
      await api('/api/markets/'+id, { method:'DELETE' });
      countries=countries.filter(function(x){return x.id!==id;});
      // Deleting a market cascades to its campaigns/assets/notifications server-side — pull fresh state.
      await Promise.all([refreshAssets(), refreshCampaigns(), refreshNotifications()]);
    }:null);
  }

  function showModal(title, bodyHtml, onSave, onDelete){
    var layer=document.getElementById('modal-layer');
    layer.innerHTML='<div id="modal-backdrop" style="position:fixed; inset:0; background:rgba(4,6,11,.7); display:flex; align-items:flex-start; justify-content:center; z-index:9999; padding:40px 16px; overflow-y:auto;">'
      + '<div class="card" style="width:100%; max-width:560px; padding:22px; background:var(--card);">'
      + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">'
      + '<div class="disp" style="font-size:17px; font-weight:700;">'+title+'</div>'
      + '<button class="btn btn-sm" id="modal-close-btn">Close</button></div>'
      + '<div>'+bodyHtml+'</div>'
      + '<div id="modal-footer" style="display:flex; justify-content:space-between; align-items:center; margin-top:18px;">'
      + (onDelete?'<button class="btn" id="modal-delete-btn" style="color:var(--danger); border-color:rgba(255,92,97,.45);">Delete</button>':'<span></span>')
      + '<button class="btn btn-primary" id="modal-save-btn">Save</button></div>'
      + '</div></div>';
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', function(e){ if(e.target.id==='modal-backdrop') closeModal(); });
    document.getElementById('modal-save-btn').addEventListener('click', function(){
      var result;
      try { result = onSave(); } catch(err){ showToast(err.message||'Something went wrong.'); return; }
      Promise.resolve(result).then(function(ok){ if(ok!==false) closeModal(); }).catch(function(err){ showToast(err.message||'Something went wrong.'); });
    });
    if(onDelete){
      var delBtn=document.getElementById('modal-delete-btn');
      var armed=false, delTimer=null;
      function resetDel(){ armed=false; delBtn.textContent='Delete'; delBtn.style.background=''; delBtn.style.color='var(--danger)'; delBtn.style.borderColor='rgba(255,92,97,.45)'; }
      delBtn.addEventListener('click', function(){
        if(!armed){
          armed=true; delBtn.textContent='Confirm delete';
          delBtn.style.background='var(--danger)'; delBtn.style.color='#fff'; delBtn.style.borderColor='var(--danger)';
          delTimer=setTimeout(resetDel, 3000);
        } else {
          clearTimeout(delTimer);
          Promise.resolve().then(onDelete).then(function(){ closeModal(); }).catch(function(err){ showToast(err.message||'Delete failed.'); });
        }
      });
    }
  }
  function closeModal(){ document.getElementById('modal-layer').innerHTML=''; }

  function timeAgo(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'just now';
    var m=Math.floor(s/60); if(m<60) return m+'m ago';
    var h=Math.floor(m/60); if(h<24) return h+'h ago';
    return Math.floor(h/24)+'d ago';
  }
  function renderBell(){
    var b=document.getElementById('bell-badge'); if(!b) return;
    var u=notifications.filter(function(n){return !n.read;}).length;
    b.style.display=u>0?'inline-flex':'none'; b.textContent=u>99?'99+':u;
  }
  function showToast(html){
    var t=document.createElement('div');
    t.innerHTML='<span style="display:inline-flex; align-items:center; gap:8px;">'+html+'</span>';
    t.style.cssText='position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px); background:#1E2333; color:#E8EBF3; border:1px solid #28303F; box-shadow:0 14px 34px -12px rgba(0,0,0,.85); padding:12px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:600; z-index:10000; opacity:0; transition:opacity .2s, transform .2s; max-width:90%;';
    document.getElementById('app-root').appendChild(t);
    requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
    setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(8px)'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },260); }, 2800);
  }
  function openNotifModal(){
    api('/api/notifications/read', { method:'POST', body: JSON.stringify({}) }).catch(function(){});
    notifications.forEach(function(n){ n.read=true; }); renderBell();
    var listHtml = notifications.length ? notifications.map(function(n){
      return '<div style="display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line-soft);">'
        + '<div class="icobox" style="width:32px; height:32px; border-radius:9px; background:var(--indigo-tint); color:var(--indigo); flex:none;">'+icon('user',16,'currentColor',1.8)+'</div>'
        + '<div style="flex:1; min-width:0;"><div style="font-size:12.5px; line-height:1.35;"><b>'+esc(n.to)+'</b> was assigned <b>“'+esc(n.title)+'”</b></div>'
        + '<div style="font-size:11px; color:var(--muted); margin-top:3px;">'+flagFor(n.market)+' '+esc(n.market)+' · '+timeAgo(n.ts)+'</div></div></div>';
    }).join('') : '<div style="text-align:center; padding:26px 8px; color:var(--faint);"><div class="icobox" style="justify-content:center;">'+icon('bell',26,'var(--faint)',1.6)+'</div><div style="font-size:12.5px; margin-top:8px;">No assignment notifications yet.</div></div>';
    var layer=document.getElementById('modal-layer');
    layer.innerHTML='<div id="modal-backdrop" style="position:fixed; inset:0; background:rgba(4,6,11,.7); display:flex; align-items:flex-start; justify-content:center; z-index:9999; padding:40px 16px; overflow-y:auto;">'
      + '<div class="card" style="width:100%; max-width:460px; padding:22px; background:var(--card);">'
      + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">'
      + '<div class="disp" style="font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;">'+icon('bell',17,'var(--ink)',1.8)+'Notifications</div>'
      + '<button class="btn btn-sm" id="notif-close-btn">Close</button></div>'
      + '<div style="max-height:52vh; overflow-y:auto;">'+listHtml+'</div>'
      + (notifications.length?'<div style="display:flex; justify-content:flex-end; margin-top:14px;"><button class="btn btn-sm" id="notif-clear-btn">Clear all</button></div>':'')
      + '</div></div>';
    document.getElementById('notif-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', function(e){ if(e.target.id==='modal-backdrop') closeModal(); });
    var clr=document.getElementById('notif-clear-btn');
    if(clr) clr.addEventListener('click', async function(){
      await api('/api/notifications/read', { method:'POST', body: JSON.stringify({clear:true}) });
      notifications=[]; renderBell(); closeModal();
    });
  }

  function setNav(tab){
    currentTab=tab;
    document.getElementById('countries-view').style.display=(tab==='countries')?'block':'none';
    document.getElementById('table-view').style.display=(tab==='table')?'block':'none';
    var cb=document.getElementById('nav-countries-btn'), tb=document.getElementById('nav-table-btn');
    if(tab==='countries'){ cb.className='nav-btn btn-active'; tb.className='nav-btn'; }
    else { tb.className='nav-btn btn-active'; cb.className='nav-btn'; }
    renderAll();
  }

  document.getElementById('hero-eyebrow').innerHTML = icon('spark',13,'#fff',2) + '<span>Creative pipeline</span>';
  document.getElementById('nav-bell-btn').innerHTML = icon('bell',17,'#fff',1.9) + '<span id="bell-badge" style="position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#FF5C61; color:#fff; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; line-height:1;">0</span>';
  document.getElementById('nav-bell-btn').addEventListener('click', openNotifModal);
  document.getElementById('add-country-btn').addEventListener('click', function(){ openCountryModal(null); });
  document.getElementById('nav-countries-btn').addEventListener('click', function(){ setNav('countries'); });
  document.getElementById('nav-table-btn').addEventListener('click', function(){ setNav('table'); });
  document.getElementById('f-search').addEventListener('input', renderAll);
  document.getElementById('f-status').addEventListener('change', renderAll);

  setNav('countries');
  load();
})();
</script>
