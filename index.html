<div id="app-shell" style="background:#0B0E14; min-height:100vh; padding:1px 0;">
<div id="app-root">
<style>
  #app-root {
    --bg:#0B0E14; --card:#161B27; --panel:#12161F; --line:#28303F; --line-soft:#1E2532;
    --ink:#E8EBF3; --muted:#9BA6BC; --faint:#5E677B;
    --indigo:#6D7BFF; --indigo-strong:#5563E8; --indigo-tint:rgba(109,123,255,.16);
    --coral:#FF7A6E; --coral-tint:rgba(255,122,110,.15);
    --amber:#FBBF3B; --amber-tint:rgba(251,191,59,.15);
    --emerald:#2DD4A0; --emerald-tint:rgba(45,212,160,.15);
    --violet:#9B87FF; --violet-tint:rgba(155,135,255,.16);
    --sky:#45B8ED; --sky-tint:rgba(69,184,237,.15);
    --rose:#F472B6; --rose-tint:rgba(244,114,182,.15);
    --linkedin:#2D9CDB; --danger:#FF5C61; --danger-tint:rgba(255,92,97,.15);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--ink); max-width:1180px; margin:0 auto; padding:0 14px 60px;
  }
  #app-root * { box-sizing:border-box; }
  #app-root .disp { font-family:'Bricolage Grotesque','Inter',sans-serif; }
  #app-root svg { display:block; }

  #app-root .btn { font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:#1A2030; cursor:pointer; color:var(--ink); transition:background .12s, border-color .12s, transform .06s; }
  #app-root .btn:hover { background:#232B3C; }
  #app-root .btn:active { transform:translateY(1px); }
  #app-root .btn-sm { padding:5px 11px; font-size:12px; display: flex; align-items: center; gap: 4px; }
  #app-root .btn-primary { background:var(--indigo); border-color:var(--indigo); color:#fff; }
  #app-root .btn-primary:hover { background:var(--indigo-strong); }
  #app-root .btn-active { background:var(--indigo); color:#fff; border-color:var(--indigo); }

  #app-root select, #app-root input, #app-root textarea { font-family:inherit; font-size:13px; padding:8px 11px; border-radius:10px; border:1px solid var(--line); color:var(--ink); background:#10141E; width:100%; }
  /* The rule above targets every input, which caught checkboxes too — a checkbox stretched to
     width:100% with 8px padding rendered as a large empty square that crushed its own label into
     a three-line wrap. Checkboxes size to their content and keep the native control. */
  #app-root input[type="checkbox"], #app-root input[type="radio"] {
    width:auto; padding:0; border-radius:0; background:none; border:none;
    accent-color:var(--indigo); flex:none; margin:0; cursor:pointer;
  }
  #app-root select:focus, #app-root input:focus, #app-root textarea:focus { outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(109,123,255,.20); }
  #app-root input::placeholder, #app-root textarea::placeholder { color:var(--faint); }
  #app-root label { font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:5px; }
  #app-root option { background:#10141E; color:var(--ink); }

  #app-root .card { background:var(--card); border:1px solid var(--line); border-radius:16px; }
  #app-root .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  #app-root .chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:4px 10px; border-radius:8px; background:#1C2230; color:var(--muted); white-space:nowrap; }
  #app-root .chip b { color:var(--ink); font-weight:700; }
  #app-root .flag { font-size:20px; line-height:1; }
  #app-root .nav-btn { font-family:inherit; font-size:13px; font-weight:600; padding:9px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.14); cursor:pointer; color:#fff; }
  #app-root .nav-btn.btn-active { background:#fff; color:var(--indigo-strong); border-color:#fff; }
  #app-root .scroll-x { overflow-x:auto; }
  #app-root .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 9px; display:flex; align-items:center; gap:7px; }

  #app-root .icobox { display:flex; align-items:center; justify-content:center; flex:none; }
  #app-root .type-tile { width:36px; height:36px; border-radius:10px; }
  #app-root .stat-icon { width:40px; height:40px; border-radius:12px; }
  #app-root .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  #app-root .asset-card { transition:box-shadow .14s, transform .08s, border-color .14s; }
  #app-root .asset-card:hover { box-shadow:0 10px 26px -14px rgba(0,0,0,.8); transform:translateY(-1px); border-color:#38425A; }
  #app-root .barwrap { display:flex; height:7px; border-radius:999px; overflow:hidden; background:var(--line-soft); }
  #app-root .barseg { height:100%; }
  #app-root .meta { display:inline-flex; align-items:center; gap:5px; }
  #app-root .perf-tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  #app-root .perf-tile .v { font-family:'Bricolage Grotesque','Inter',sans-serif; font-weight:700; font-size:16px; margin-top:2px; }
  #app-root .perf-tile .l { font-size:10.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  #app-root a { color:var(--indigo); }

  /* Shared treatment for every data table. Values used to be left at the default weight, which on
     a dark card renders visibly dimmer than the bold label next to it even at the same colour —
     the numbers read as greyed-out. Data cells are the thing being read here, so they get full
     ink and a heavier weight than the headers around them. Tabular figures keep the digits in a
     column from jittering as they change width. */
  #app-root .data-table { width:100%; border-collapse:collapse; font-size:13px; }
  #app-root .data-table th {
    text-align:left; padding:10px 12px; font-size:10.5px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
    border-bottom:1px solid var(--line); background:#12161F;
  }
  #app-root .data-table td {
    padding:11px 12px; color:var(--ink); font-weight:500;
    border-bottom:1px solid var(--line-soft); font-variant-numeric:tabular-nums;
  }
  #app-root .data-table th.num, #app-root .data-table td.num { text-align:right; }
  #app-root .data-table td.dim { color:var(--muted); font-weight:400; }
  #app-root .data-table tbody tr:hover { background:rgba(255,255,255,.032); }
  #app-root .data-table tbody tr:last-child td { border-bottom:none; }
  #app-root .data-table .sub { font-size:10.5px; color:var(--faint); font-weight:500; margin-top:2px; }
  #app-root .data-table .empty { padding:24px; text-align:center; color:var(--faint); font-weight:400; }

  #app-root .tab-thumb-swiper { margin-bottom:10px; }
  #app-root .tab-thumb-swiper, #app-root .tab-thumb-swiper .swiper-wrapper { height:auto; }
  #app-root .tab-thumb-swiper .swiper-slide { width:auto; height:auto; }
  #app-root .tab-pill { font-family:inherit; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:#161B27; color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .12s, color .12s, border-color .12s; }
  #app-root .tab-pill-count { font-size:10.5px; font-weight:700; color:var(--faint); background:#0E121B; padding:1px 6px; border-radius:999px; }
  #app-root .swiper-slide-thumb-active .tab-pill { background:var(--indigo); border-color:var(--indigo); color:#fff; }
  #app-root .swiper-slide-thumb-active .tab-pill-count { background:rgba(255,255,255,.22); color:#fff; }
  #app-root .tab-main-swiper .swiper-slide { height:auto; max-height:520px; overflow-y:auto; }

  #app-root .tab-main-swiper .swiper-slide, #app-root .scroll-x { scrollbar-width:thin; scrollbar-color:#3A4459 transparent; }
  #app-root .tab-main-swiper .swiper-slide::-webkit-scrollbar, #app-root .scroll-x::-webkit-scrollbar { width:8px; height:8px; }
  #app-root .tab-main-swiper .swiper-slide::-webkit-scrollbar-track, #app-root .scroll-x::-webkit-scrollbar-track { background:transparent; }
  #app-root .tab-main-swiper .swiper-slide::-webkit-scrollbar-thumb, #app-root .scroll-x::-webkit-scrollbar-thumb { background:#3A4459; border-radius:999px; border:2px solid transparent; background-clip:padding-box; }
  #app-root .tab-main-swiper .swiper-slide::-webkit-scrollbar-thumb:hover, #app-root .scroll-x::-webkit-scrollbar-thumb:hover { background:#4A5570; background-clip:padding-box; }

  @keyframes appfade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }
  #app-root .fadein { animation:appfade .35s ease both; }
  @media (prefers-reduced-motion: reduce){ #app-root .fadein { animation:none; } }
  @media (max-width:760px){ #app-root #stats-row { grid-template-columns:repeat(2,1fr) !important; } }
</style>

<div style="position:relative; overflow:hidden; border-radius:22px; margin:20px 0 18px; padding:26px 28px; background:linear-gradient(120deg,#4A3AE0 0%,#6D5BF5 46%,#8B3BE0 100%); color:#fff;">
  <svg viewBox="0 0 200 200" style="position:absolute; right:-30px; top:-40px; width:280px; height:280px; opacity:.20;" aria-hidden="true">
    <rect x="34" y="20" width="60" height="76" rx="10" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="74" y="52" width="60" height="76" rx="10" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".7"/>
    <rect x="114" y="86" width="60" height="76" rx="10" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".45"/>
    <circle cx="150" cy="46" r="16" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".5"/>

  <div style="position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;">

      <div class="disp" style="font-size:30px; font-weight:800; letter-spacing:-.5px; margin-top:12px; line-height:1.05;">LinkedIn asset tracker</div>
      <div style="font-size:13.5px; color:rgba(255,255,255,.85); margin-top:8px; max-width:580px;">Each country's POC logs and tracks creative assets from brief to live, with ad performance rolled up per market. Shared live across content and performance marketing.</div>

<script>
(function(){
  var ICONS = {
    spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>',
    video:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/>',
    carousel:'<rect x="3" y="4" width="7" height="16" rx="1.6"/><rect x="14" y="4" width="7" height="16" rx="1.6"/>',
    document:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h5"/>',
    copy:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    stack:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    calendar:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
    folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    ext:'<path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
    inbox:'<path d="M3 12l3-7h12l3 7"/><path d="M3 12v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6"/><path d="M3 12h5l2 3h4l2-3h5"/>',
    chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M13 16V8M18 16v-6"/>',
    dollar:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M14.5 9.4c0-1.1-1.1-1.9-2.5-1.9s-2.5.8-2.5 1.9 1.1 1.7 2.5 2 2.5.8 2.5 2-1.1 1.9-2.5 1.9-2.5-.8-2.5-1.9"/>',
    magnet:'<circle cx="9" cy="8" r="4"/><path d="M2.5 21c0-3.8 3.2-5.6 6.5-5.6"/><path d="M17 8v6M14 11h6"/>',
    funnel:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',
    target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
    caretDown:'<path d="M6 9l6 6 6-6"/>',
    caretRight:'<path d="M9 6l6 6-6 6"/>',
    bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'
  };
  function icon(name, size, color, sw){
    size=size||18;
    return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="'+(sw||1.7)+'" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
  }

  var STATUS_LIST = ["Requested","Briefed","In Progress","In Review","Revisions Needed","Approved","Delivered","Live on LinkedIn","Archived"];
  var STATUS_COLOR = {
    "Requested":        {bg:"rgba(148,163,184,.16)", fg:"#B4BECF", solid:"#7A879C"},
    "Briefed":          {bg:"var(--sky-tint)",       fg:"#7FD0F5", solid:"#45B8ED"},
    "In Progress":      {bg:"var(--indigo-tint)",    fg:"#AAB2FF", solid:"#6D7BFF"},
    "In Review":        {bg:"var(--amber-tint)",     fg:"#F6C860", solid:"#FBBF3B"},
    "Revisions Needed": {bg:"var(--rose-tint)",      fg:"#F79FCB", solid:"#F472B6"},
    "Approved":         {bg:"var(--emerald-tint)",   fg:"#6EE7C0", solid:"#37D9A6"},
    "Delivered":        {bg:"var(--emerald-tint)",   fg:"#34D399", solid:"#22C29A"},
    "Live on LinkedIn": {bg:"var(--linkedin)",       fg:"#ffffff", solid:"#2D9CDB"},
    "Archived":         {bg:"rgba(120,130,150,.16)", fg:"#97A0B4", solid:"#6B7488"}
  };
  var TYPE_LIST = ["Image","Video","Carousel","Document","Copy-only"];
  var TYPE_CFG = {
    "Image":     {ic:"image",    color:"var(--sky)",     tint:"var(--sky-tint)"},
    "Video":     {ic:"video",    color:"var(--coral)",   tint:"var(--coral-tint)"},
    "Carousel":  {ic:"carousel", color:"var(--violet)",  tint:"var(--violet-tint)"},
    "Document":  {ic:"document", color:"var(--emerald)", tint:"var(--emerald-tint)"},
    "Copy-only": {ic:"copy",     color:"var(--amber)",   tint:"var(--amber-tint)"}
  };
  var FLAGS = { "UAE":"🇦🇪","Germany":"🇩🇪","Oman":"🇴🇲","Philippines":"🇵🇭","India":"🇮🇳","Global":"🌐" };
  var ACCENTS = ["#6D7BFF","#FF7A6E","#2DD4A0","#9B87FF","#45B8ED","#FBBF3B","#F472B6"];
  var COUNTRY_ACCENT = { "UAE":"#2DD4A0","Germany":"#FBBF3B","Oman":"#9B87FF","Philippines":"#45B8ED","India":"#FF7A6E","Global":"#6D7BFF" };
  var METRIC_FIELDS = ["spend","impressions","clicks","reach","leads"];

  var assets = [], countries = [], campaigns = [], notifications = [], expanded = {}, currentTab = "countries";
  // Campaign panels show only what LinkedIn is currently delivering; this reveals the rest.
  // Persisted so the choice survives a reload.
  var showAllCampaigns = (function(){ try { return localStorage.getItem('showAllCampaigns')==='1'; } catch(e){ return false; } })();
  // Whether one creative running in several ad sets is shown as one combined row or as one row per
  // ad set. Defaults to combined; persisted so the choice survives a reload.
  var mergeDuplicates = (function(){ try { return localStorage.getItem('mergeDuplicates')!=='0'; } catch(e){ return true; } })();
  var activeAssetTab = {}, tabMainSwipers = {}, tabThumbSwipers = {};
  // Which merged creatives have their per-ad-set breakdown unfolded, keyed by the merge key.
  var expandedAssets = {};
  var dateRange = { start:null, end:null };
  // What the user picked, so the button can say "Q3 2026" rather than re-deriving "Jul 1 – Sep 30".
  // A range typed on the calendar has no label and falls back to the dates.
  var dateRangeLabelOverride = '';
  var calendarOpen = false;
  var calendarMode = 'month';
  var calView = (function(){ var d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; })();
  // Year the month/quarter grids are showing. Independent of calView so paging months on the
  // day-grid doesn't silently move which year the quarter buttons refer to.
  var periodYear = new Date().getFullYear();
  // Companies-that-saw-this-ad-set, fetched per campaign on demand: { campaignId: {...} }.
  var companyPanels = {};
  var syncHealth = null;
  var libraryDraftRows = null;
  var libFilters = { q:'', country:'', status:'' };

  function pad2(n){ return String(n).length<2 ? "0"+n : String(n); }
  function isoOf(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  function reportingPeriodLabel(){ return dateRangeLabel(); }
  function dateRangeLabel(){
    // A month or quarter picked by name keeps that name — "Q3 2026" reads better than the
    // equivalent "Jul 1 – Sep 30", and says which period the numbers are for without arithmetic.
    if(dateRangeLabelOverride && (dateRangeLabelOverride==='All time' || dateRange.start)) return dateRangeLabelOverride;
    if(!dateRange.start && !dateRange.end) return "All time";
    if(dateRange.start && dateRange.end) return fmtDate(dateRange.start)+" – "+fmtDate(dateRange.end);
    if(dateRange.start) return "From "+fmtDate(dateRange.start);
    return "Until "+fmtDate(dateRange.end);
  }

  function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function flagFor(n){ return FLAGS[n] || "🌐"; }
  function accentFor(n){ if(COUNTRY_ACCENT[n]) return COUNTRY_ACCENT[n]; var h=0; for(var i=0;i<(n||"").length;i++) h=(h*31+n.charCodeAt(i))>>>0; return ACCENTS[h%ACCENTS.length]; }
  function num(v){ return Number(v)||0; }
  function fmtInt(v){ return Math.round(num(v)).toLocaleString(); }
  function fmtMoney(v){ return "₹"+Math.round(num(v)).toLocaleString(); }
  function fmtPct(v){ return (Math.round(num(v)*100)/100).toFixed(2)+"%"; }
  function fmtDec(v){ return "₹"+(Math.round(num(v)*100)/100).toFixed(2); }
  function fmtDate(d){ if(!d) return ""; var dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
  function isoToday(){ return new Date().toISOString().slice(0,10); }

  // ---- backend API ----
  async function api(path, opts){
    var res = await fetch(path, Object.assign({ headers:{ 'Content-Type':'application/json' } }, opts||{}));
    if(!res.ok){

    return res.json();

      id:c.id, name:c.name, marketId:c.market_id, marketName:c.market_name||'', liCampaignId:c.li_campaign_id||'',
      spend:num(c.spend), impressions:num(c.impressions), clicks:num(c.clicks), reach:num(c.reach), leads:num(c.leads),

  // LinkedIn reports campaign state two ways: `status` is what the advertiser set (ACTIVE, PAUSED,
  // ARCHIVED...) and `servingStatuses` says whether it can actually deliver right now. The two
  // disagree often — most of this account's ACTIVE campaigns sit on CAMPAIGN_GROUP_STATUS_HOLD

  function isCampaignLive(c){

  async function load(){
    // Land on the current month rather than all-time: the month-to-date figure is the one people
    // are reporting on, and an all-time total on first paint reads as wildly overstated spend.
    if(!dateRange.start && !dateRange.end) applyDatePreset(DATE_PRESETS[0]);
    var qs = dateRangeQuery();
    try {
      var results = await Promise.all([api('/api/markets'), api('/api/campaigns'+qs), api('/api/assets'+qs), api('/api/notifications')]);
      countries = results[0].map(mapMarketFromApi);
      campaigns = results[1].map(mapCampaignFromApi);
      assets = results[2].map(mapAssetFromApi);
      notifications = results[3].map(mapNotifFromApi);
    } catch(e){
      console.error('Failed to load from API', e);
      showToast('Could not reach the backend API — check it is deployed and reachable.');
      countries=[]; campaigns=[]; assets=[]; notifications=[];
    }
    // Collapsed by default: seven markets expanded at once is several screens of scrolling before
    // the first useful comparison. The header row still carries each market's headline numbers, so
    // nothing is hidden — open the one you're working on.
    countries.forEach(function(c){ if(expanded[c.id]===undefined) expanded[c.id]=false; });
    renderAll(); renderBell();
  }
  // No range means "All time", and that has to be said explicitly: an empty query string makes the
  // API fall back to the current month, which used to come back labelled "All time".
  function dateRangeQuery(){ return (dateRange.start && dateRange.end) ? ('?start='+dateRange.start+'&end='+dateRange.end) : '?all=1'; }
  async function refreshAssets(){ var rows=await api('/api/assets'+dateRangeQuery()); assets=rows.map(mapAssetFromApi); renderAll(); }
  async function refreshCampaigns(){ var rows=await api('/api/campaigns'+dateRangeQuery()); campaigns=rows.map(mapCampaignFromApi); renderAll(); }
  // Reporting period for spend/impressions/etc, same idea as LinkedIn Campaign Manager's date
  // picker — refetches both lists so the numbers reflect the selected window, current month if unset.
  async function reloadForDateRange(){
    var qs=dateRangeQuery();
    // Company engagement is fetched for one specific window and can't be re-sliced, so anything
    // already loaded describes the *previous* period — drop it rather than show it under the new
    // date range's heading.
    companyPanels={};
    var results=await Promise.all([api('/api/campaigns'+qs), api('/api/assets'+qs)]);
    campaigns=results[0].map(mapCampaignFromApi);

  }

  async function resolveCampaignId(marketId, name){
    if(!name) return null;
    var existing = campaigns.find(function(c){ return c.marketId===marketId && c.name.toLowerCase()===name.toLowerCase(); });
    if(existing) return existing.id;
    var created = await api('/api/campaigns', { method:'POST', body: JSON.stringify({ name:name, marketId:marketId }) });
    var mapped = mapCampaignFromApi(created);
    campaigns.push(mapped);
    return mapped.id;
  }

  function isOverdue(a){ if(a.dateDelivered) return false; if(["Delivered","Live on LinkedIn","Archived"].indexOf(a.status)!==-1) return false; if(!a.dueDate) return false; var t=new Date(); t.setHours(0,0,0,0); return new Date(a.dueDate)<t; }
  function derived(a){ var im=num(a.impressions),cl=num(a.clicks),sp=num(a.spend),le=num(a.leads); return { ctr:im>0?cl/im*100:0, cpc:cl>0?sp/cl:0, cpm:im>0?sp/im*1000:0, cpl:le>0?sp/le:0 }; }
  // Market-level rollups use the campaign totals, not a sum of tracked assets — a campaign can run
  // ads that haven't been logged as an asset yet, so summing only known assets would under-count.
  function campaignTotalsFor(marketId){
    var t={spend:0,impressions:0,clicks:0,reach:0,leads:0};
    campaignsForMarket(marketId).forEach(function(cam){
      METRIC_FIELDS.forEach(function(f){ t[f]+=num(cam[f]); });
    });
    return t;
  }

  function matchesFilter(a){ var q=document.getElementById('f-search').value.toLowerCase(); var s=document.getElementById('f-status').value; if(s&&a.status!==s) return false; if(q&&a.title.toLowerCase().indexOf(q)===-1&&a.campaign.toLowerCase().indexOf(q)===-1) return false; return true; }

  var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  // Last day of a month, as an ISO string. Day 0 of the *next* month is the last of this one,
  // which sidesteps having to special-case February and leap years.
  function monthEndIso(y, m){ var d=new Date(y, m+1, 0); return isoOf(y, m, d.getDate()); }

  // Reporting periods never run past today — a month or quarter still in progress reports
  // month-to-date, the way Campaign Manager does. Without this, picking the current quarter would
  // ask the API for dates that haven't happened, and the period label would imply the numbers were
  // final when they're a third of the way in.
  function clampToToday(iso){ var t=isoToday(); return iso>t ? t : iso; }

  function applyMonth(y, m){
    dateRange = { start:isoOf(y,m,1), end:clampToToday(monthEndIso(y,m)) };
    dateRangeLabelOverride = MONTH_NAMES[m]+' '+y;
  }
  function applyQuarter(y, q){
    var startMonth = q*3;
    dateRange = { start:isoOf(y,startMonth,1), end:clampToToday(monthEndIso(y,startMonth+2)) };
    dateRangeLabelOverride = 'Q'+(q+1)+' '+y;
  }
  var DATE_PRESETS = [
    { label:"This month", kind:"thisMonth" },
    { label:"Last month", kind:"lastMonth" },
    { label:"This quarter", kind:"thisQuarter" },
    { label:"Last 7 days", kind:"days", days:7 },
    { label:"Last 30 days", kind:"days", days:30 },
    { label:"All time", kind:"all" }
  ];
  function applyDatePreset(p){
    var d = new Date(), y = d.getFullYear(), m = d.getMonth();
    if(p.kind==='all'){ dateRange={start:null,end:null}; dateRangeLabelOverride='All time'; return; }
    if(p.kind==='thisMonth'){ applyMonth(y, m); return; }
    if(p.kind==='lastMonth'){ if(m===0) applyMonth(y-1, 11); else applyMonth(y, m-1); return; }
    if(p.kind==='thisQuarter'){ applyQuarter(y, Math.floor(m/3)); return; }
    if(p.kind==='days'){
      dateRange = { start:addDaysIso(isoToday(), -(p.days-1)), end:isoToday() };
      dateRangeLabelOverride = 'Last '+p.days+' days';
    }
  }
  function addDaysIso(iso, n){
    var p=iso.split("-").map(Number);
    var d=new Date(p[0], p[1]-1, p[2]+n);
    return isoOf(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function calendarGridHtml(){

  // Whether a month/quarter button represents the period currently being reported on. Compared on
  // the start date alone: an in-progress period is clamped to today, so its end won't match the
  // period's natural end and comparing both would never light up the current month.
  function isActivePeriod(startIso){ return dateRange.start===startIso; }

  function monthGridHtml(){

    document.getElementById('date-filter-btn').addEventListener('click', function(e){ e.stopPropagation(); calendarOpen=!calendarOpen; renderDateFilter(); });

    var head='<div class="section-title" style="margin:0 0 10px;">'+icon('chart',14,'var(--muted)',1.8)+' Ad performance <span style="color:var(--faint); font-weight:600; text-transform:none; letter-spacing:0;">· '+reportingPeriodLabel()+' · '+list.length+' assets</span></div>';

    return '<div style="background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:13px;">'+head
      + '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;">'+grid+'</div></div>';
  }
  function renderOverall(){
    // The leads column appears only if at least one market runs a lead-gen campaign, so it isn't a
    // column of zeros; headers are derived from the same call that builds the cells so they can't
    // drift apart.
    var anyLeadGen = countries.some(function(c){ return marketHasLeadGen(c.id); });
    // Acronyms have to be spelt out rather than title-cased, or CPC renders as "Cpc".
    var HEADER_LABEL = { cost:'Cost', clicks:'Clicks', impr:'Impr', cpc:'CPC', leads:'Leads' };
    var heads=['Country'].concat(metricList({spend:0,clicks:0,impressions:0,leads:0}, anyLeadGen).map(function(x){
      return HEADER_LABEL[x[0]] || x[0];
    }));
    var rows=countries.map(function(c){
      var list=assets.filter(function(a){return a.marketId===c.id;});
      var t=campaignTotalsFor(c.id);
      var accent=accentFor(c.country);
      var cells=metricList(t, anyLeadGen).map(function(x){ return '<td class="num">'+x[1]+'</td>'; }).join('');
      return '<tr>'
        + '<td style="white-space:nowrap;"><span class="meta"><span class="dot" style="background:'+accent+';"></span>'+flagFor(c.country)+' <b style="font-weight:600;">'+esc(c.country)+'</b> <span style="color:var(--faint); font-weight:600; margin-left:2px;">'+list.length+'</span></span></td>'
        + cells + '</tr>';
    }).join('');
    document.getElementById('overall-perf').innerHTML =
      '<div class="card fadein" style="padding:15px 17px;">'
      + '<div class="section-title" style="margin:0 0 11px;">'+icon('chart',14,'var(--indigo)',1.8)+' Performance by country <span style="color:var(--faint); font-weight:600; text-transform:none; letter-spacing:0;">· '+reportingPeriodLabel()+' · '+countries.length+' markets</span></div>'
      + '<div class="scroll-x"><table class="data-table" style="min-width:640px;">'
      + '<thead><tr>'
      + heads.map(function(h,i){ return '<th'+(i===0?'':' class="num"')+'>'+h+'</th>'; }).join('')
      + '</tr></thead><tbody>'+(rows||'<tr><td colspan="'+heads.length+'" class="empty">No countries yet</td></tr>')+'</tbody></table></div>'
      + '</div>';
  }

  // ---- home page: overall campaign performance ----
  //
  // The landing view answered "how is each country doing" but never "how are we doing overall" —
  // that total had to be added up by eye across six country rows. Everything here is campaign-level
  // (not a sum of tracked assets) for the same reason the per-market rollups are: a campaign can
  // run ads nobody has logged as an asset yet.
  function totalsFor(list){
    var t={spend:0,impressions:0,clicks:0,reach:0,leads:0};
    list.forEach(function(c){ METRIC_FIELDS.forEach(function(f){ t[f]+=num(c[f]); }); });
    return t;
  }
  function liveCampaigns(){ return campaigns.filter(isCampaignLive); }

  function bigMetricTile(label, value, sub, color){
    return '<div style="background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 14px;">'
      + '<div style="font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em;">'+label+'</div>'
      + '<div class="disp" style="font-size:21px; font-weight:800; margin-top:5px; line-height:1;'+(color?' color:'+color+';':'')+'">'+value+'</div>'
      + (sub?'<div style="font-size:10.5px; color:var(--faint); margin-top:4px;">'+sub+'</div>':'')
      + '</div>';
  }

  function renderOverallCampaigns(){
    var el=document.getElementById('overall-campaigns');
    if(!el) return;
    var live=liveCampaigns();
    var all=campaigns;
    var t=totalsFor(all);
    var d=derived(t);
    var linked=all.filter(function(c){return c.liCampaignId;}).length;

    var leadGen = all.filter(isLeadGenCampaign);
    var tiles=[
      bigMetricTile('Total spend', fmtMoney(t.spend), reportingPeriodLabel(), 'var(--emerald)'),
      bigMetricTile('Impressions', fmtInt(t.impressions), fmtPct(d.ctr)+' CTR'),
      bigMetricTile('Clicks', fmtInt(t.clicks), fmtDec(d.cpc)+' CPC'),
      bigMetricTile('CPM', fmtDec(d.cpm), 'per 1,000 impressions')
    ];
    // Only meaningful if something in the account can actually generate a lead.
    if(leadGen.length){
      var lt = totalsFor(leadGen);
      var ld = derived(lt);
      tiles.push(bigMetricTile('Leads', fmtInt(lt.leads),
        num(lt.leads)>0 ? fmtDec(ld.cpl)+' CPL' : 'across '+leadGen.length+' lead-gen ad sets', 'var(--indigo)'));
    }
    tiles.push(bigMetricTile('Live ad sets', live.length, all.length+' total · '+linked+' linked', live.length?'var(--emerald)':'var(--muted)'));
    tiles = tiles.join('');

    // Headline totals only. The per-ad-set breakdown that used to sit here duplicated the campaigns
    // panel inside each country block, which is where you act on a single ad set anyway.
    el.innerHTML='<div class="card fadein" style="padding:15px 17px;">'
      + '<div class="section-title" style="margin:0 0 4px;">'+icon('target',14,'var(--indigo)',1.8)+' Overall campaign performance <span style="color:var(--faint); font-weight:600; text-transform:none; letter-spacing:0;">· '+reportingPeriodLabel()+'</span></div>'
      // Spelt out because the campaigns panels below list live ad sets only while these totals do
      // not — spend in the period is spend in the period, whether or not the ad set is still running.
      + '<div style="font-size:11px; color:var(--faint); margin-bottom:11px;">Totals cover all '+all.length+' ad sets in the period, including ones no longer running.</div>'
      + '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:9px;">'+tiles+'</div>'
      + '</div>';
  }

  // How stale the numbers are. The sync runs every 2 hours; when it stops running the symptom is
  // numbers that simply stop moving, which looks identical to a quiet week — so say it outright.
  async function refreshSyncHealth(){
    try { syncHealth = await api('/api/health'); } catch(e){ syncHealth = { error:e.message }; }
    renderFreshness();
  }
  function renderFreshness(){
    var el=document.getElementById('freshness-pill');
    if(!el) return;
    if(!syncHealth){ el.innerHTML=''; return; }
    if(syncHealth.error){
      el.innerHTML='<span class="chip" style="background:rgba(255,92,97,.2); color:#FFB4B6;">Backend unreachable — '+esc(syncHealth.error)+'</span>';
      return;
    }
    var last=syncHealth.sync && syncHealth.sync.last;
    var bits=[];
    if(last){
      var age=Date.now()-new Date(last.run_at).getTime();
      // Two missed cycles rather than one: GitHub's scheduler routinely runs a few minutes late,
      // and flagging that as a failure would cry wolf every other day.
      var late=age > 4*3600*1000;
      bits.push('<span class="chip" style="background:rgba(255,255,255,'+(late?'.28':'.18')+'); color:#fff;">'
        + (late?'⚠ ':'')+'Synced '+timeAgo(new Date(last.run_at).getTime())
        + (last.status!=='ok'?' · '+esc(last.status):'')+'</span>');
    } else {
      bits.push('<span class="chip" style="background:rgba(255,255,255,.18); color:#fff;">Never synced</span>');
    }
    bits.push('<span style="opacity:.75;">Refreshes every 2 hours · '+esc((syncHealth.linkedin&&syncHealth.linkedin.mode)||'?')+' mode</span>');
    if(syncHealth.warnings && syncHealth.warnings.length){
      bits.push('<span class="chip" style="background:rgba(240,180,60,.28); color:#FFE1A3;" title="'+esc(syncHealth.warnings.join(' | '))+'">'+syncHealth.warnings.length+' warning'+(syncHealth.warnings.length===1?'':'s')+'</span>');
    }
    el.innerHTML='<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">'+bits.join('')+'</div>';
  }

  // Leads are only reported for LEAD_GENERATION campaigns — LinkedIn's `oneClickLeads` counts
  // lead-form submissions, which a website-conversion campaign has none of by construction. Showing
  // "0 leads" against two thirds of this account's ad sets reads as a tracking failure rather than
  // as "this objective doesn't produce leads", so the column is shown only where it can be non-zero.
  var LEAD_GEN = 'LEAD_GENERATION';
  function campaignById(id){ return campaigns.find(function(c){ return c.id===id; }) || null; }
  function isLeadGenCampaign(c){ return Boolean(c && c.objective===LEAD_GEN); }
  function marketHasLeadGen(marketId){ return campaignsForMarket(marketId).some(isLeadGenCampaign); }
  // A merged creative can span objectives; if any placement is lead-gen the number means something.
  function assetHasLeadGen(a){
    var parts = a && a.parts ? a.parts : [a];
    return parts.some(function(p){ return isLeadGenCampaign(campaignById(p.campaignId)); });
  }

  // Reach is deliberately absent. LinkedIn reports `approximateMemberReach` per day, so summing a
  // range counts the same member once per day they were served — it is not the unique reach
  // Campaign Manager shows, and it tracked impressions at ~89% anyway, so it added a number that
  // looked authoritative while saying nothing impressions didn't. Still collected and stored.
  function metricList(o, showLeads){
    var d=derived(o);
    var out=[['cost',fmtMoney(o.spend)],['clicks',fmtInt(o.clicks)],['impr',fmtInt(o.impressions)],['cpc',fmtDec(d.cpc)]];
    if(showLeads) out.push(['leads',fmtInt(o.leads)]);
    return out;
  }
  function metricChips(a){
    // A combined figure has to announce itself. Otherwise a creative running in three ad sets shows
    // triple the spend of the matching Campaign Manager line and reads as a bug rather than a sum.
    var combined = a && a.merged;
    return '<div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">'
      + (combined?'<span class="chip" style="background:var(--violet-tint); color:#C9BFFF;">'+icon('stack',11,'currentColor',1.8)+'combined</span>':'')
      + metricList(a, assetHasLeadGen(a)).map(function(x){ return '<span class="chip"><b>'+x[1]+'</b> '+x[0]+'</span>'; }).join('') + '</div>';
  }

  // The breakdown behind a merged creative, one line per ad set.
  //
  // Rolled up by campaign rather than listed per placement: LinkedIn routinely holds several
  // creative IDs for the same artwork inside one ad set (this account has a creative appearing 18
  // times across 7 ad sets), and 18 near-identical lines answer nothing. Per ad set is the level
  // the question is actually asked at.
  function mergedBreakdownHtml(g){
    var byCampaign = {}, order = [];
    g.parts.forEach(function(p){
      var k = p.campaign || '—';
      if(!byCampaign[k]){ byCampaign[k]={ campaign:k, market:p.market, placements:0, firstId:p.id, spend:0, impressions:0, clicks:0, reach:0, leads:0 }; order.push(k); }
      var b = byCampaign[k];
      b.placements++;
      METRIC_FIELDS.forEach(function(f){ b[f] += num(p[f]); });
    });
    var rows = order.sort(function(a,b){ return byCampaign[b].spend - byCampaign[a].spend; }).map(function(k){
      var b = byCampaign[k];
      var d = derived(b);
      return '<div class="merged-part" data-id="'+b.firstId+'" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:7px 0; border-top:1px dashed var(--line-soft); cursor:pointer;">'
        + '<span class="chip" style="background:var(--indigo-tint); color:#AAB2FF;">'+icon('target',11,'currentColor',1.8)+esc(b.campaign)+'</span>'
        + '<span style="font-size:11px; color:var(--faint);">'+flagFor(b.market)+' '+esc(b.market||'')
        + (b.placements>1?' · '+b.placements+' placements':'')+'</span>'
        + '<span style="margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;">'
        + '<span class="chip"><b>'+fmtMoney(b.spend)+'</b> spend</span>'
        + '<span class="chip"><b>'+fmtInt(b.impressions)+'</b> impr</span>'
        + '<span class="chip"><b>'+fmtInt(b.clicks)+'</b> clicks</span>'
        + '<span class="chip"><b>'+fmtPct(d.ctr)+'</b> CTR</span>'
        + '</span></div>';
    }).join('');
    return '<div style="margin-top:9px; padding-top:2px;">'
      + '<div style="font-size:10.5px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;">Running in '+order.length+' ad set'+(order.length===1?'':'s')
      + (g.parts.length!==order.length?' · '+g.parts.length+' placements':'')+'</div>'
      + rows + '</div>';
  }

  function assetRowHtml(a){
    var overdue=isOverdue(a);
    var col=STATUS_COLOR[a.status]||STATUS_COLOR["Requested"];
    var merged = a.merged;
    var open = merged && expandedAssets[a.key];
    return '<div class="card asset-card fadein" data-id="'+a.id+'" style="padding:13px 15px; margin-bottom:9px; cursor:pointer; border-color:'+(overdue?'rgba(255,92,97,.55)':'var(--line)')+';">'
      + '<div style="display:flex; gap:12px; align-items:flex-start;">'
      + typeTile(a.type)
      + '<div style="flex:1; min-width:0;">'
      + '<div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap;">'
      + '<div style="min-width:180px; flex:1;"><div style="font-size:13.5px; font-weight:600; line-height:1.25;">'+esc(a.title)
      + (merged?' <button type="button" class="merge-toggle chip" data-key="'+esc(a.key)+'" style="background:var(--violet-tint); color:#C9BFFF; vertical-align:middle; border:none; font-family:inherit; cursor:pointer;" title="The same creative running as '+a.parts.length+' ads across '+adSetCount(a)+' ad set(s). Numbers below are the combined total.">'+icon('stack',11,'currentColor',1.8)+'merged from '+mergeLabel(a)+' '+(open?'▴':'▾')+'</button>':'')+'</div>'
      + '<span class="chip" style="margin-top:6px; background:var(--indigo-tint); color:#AAB2FF;">'+icon('target',12,'currentColor',1.8)+esc(a.campaign||'—')+'</span></div>'
      + '<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">'
      + '<span class="badge" style="background:'+col.bg+'; color:'+col.fg+';">'+a.status+'</span>'
      + (overdue?'<span class="badge" style="background:var(--danger-tint); color:var(--danger);">'+icon('clock',12,'currentColor',2)+' Overdue</span>':'')
      + '</div></div>'
      + '<div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:9px; font-size:11.5px; color:var(--muted);">'
      + (a.assignedTo?'<span class="meta">'+icon('user',13,'var(--faint)',1.8)+esc(a.assignedTo)+'</span>':'')
      + (a.dueDate?'<span class="meta">'+icon('calendar',13,'var(--faint)',1.8)+fmtDate(a.dueDate)+'</span>':'')
      + (a.version?'<span class="chip">'+esc(a.version)+'</span>':'')
      + (a.link?'<a href="'+esc(a.link)+'" target="_blank" rel="noopener" class="meta" style="margin-left:auto; text-decoration:none; font-weight:600;" onclick="event.stopPropagation();">'+icon('folder',13,'currentColor',1.8)+'Asset</a>':'')
      + (a.adCopyLink?'<a href="'+esc(a.adCopyLink)+'" target="_blank" rel="noopener" class="meta" style="'+(a.link?'':'margin-left:auto; ')+'color:var(--amber); text-decoration:none; font-weight:600;" onclick="event.stopPropagation();">'+icon('copy',13,'currentColor',1.8)+'Ad copy</a>':'')
      + (a.creativeLink?'<a href="'+esc(a.creativeLink)+'" target="_blank" rel="noopener" class="meta" style="'+((a.link||a.adCopyLink)?'':'margin-left:auto; ')+'color:var(--violet); text-decoration:none; font-weight:600;" onclick="event.stopPropagation();">'+icon('image',13,'currentColor',1.8)+'Creatives</a>':'')
      + '</div>'
      + metricChips(a)
      + (open ? mergedBreakdownHtml(a) : '')
      + '</div></div></div>';
  }

  // ---- merging the same creative across campaigns ----
  //
  // The same creative is uploaded once per ad set it runs in, so LinkedIn hands back several
  // distinct ads — different creative IDs, different campaigns, identical artwork and name (e.g.
  // "Beyond e-Invoicing" running in both GLOBAL_US_E-INV_AUG_26 and Global_UK_E-INV_AUG_26). Listed
  // separately they read as duplicates and their spend has to be added up by hand to answer "how
  // did this creative do".
  //
  // Grouped on the ad name, which is what the creative is actually identified by in Campaign
  // Manager, rather than the creative ID (unique per placement, so it would never group anything).
  // With merging off, every ad is its own group — each row then lines up one-to-one with a row in
  // Campaign Manager, which is what you need when reconciling figures. With it on, one creative is
  // one row no matter how many ad sets it runs in, which is what you need when deciding whether the
  // creative works. Both are correct; they answer different questions, so it's a switch.
  function assetGroupKey(a){
    return mergeDuplicates ? (a.title||'').trim().toLowerCase() : ('#'+a.id);
  }

  // How many distinct ad sets a merged creative runs in — not the same as how many placements it
  // has, since one ad set can hold several creative IDs for the same artwork.
  function adSetCount(g){ return Math.max(g.campaignNames.length, 1); }

  // What the merge badge says. A creative uploaded twice into the *same* ad set is still a merge
  // worth showing, but calling it "1 ad set" reads like a mistake — name the placements instead.
  function mergeLabel(g){
    var n = adSetCount(g);
    return n > 1 ? n+' ad sets' : g.parts.length+' placements';
  }

  // Ratios can't be summed — CTR of the merged creative is total clicks over total impressions,
  // not the average of each placement's CTR, which would weight a 12-impression ad the same as a
  // 12,000-impression one.
  function mergeAssets(list){
    var byKey = {};
    var order = [];
    list.forEach(function(a){
      var k = assetGroupKey(a);
      if(!byKey[k]){
        byKey[k] = {
          key:k, title:a.title, type:a.type, primary:a, parts:[],
          spend:0, impressions:0, clicks:0, reach:0, leads:0,
          campaignNames:[], marketNames:[], statuses:[]
        };
        order.push(k);
      }
      var g = byKey[k];
      g.parts.push(a);
      METRIC_FIELDS.forEach(function(f){ g[f] += num(a[f]); });
      if(a.campaign && g.campaignNames.indexOf(a.campaign)===-1) g.campaignNames.push(a.campaign);
      if(a.market && g.marketNames.indexOf(a.market)===-1) g.marketNames.push(a.market);
      if(g.statuses.indexOf(a.status)===-1) g.statuses.push(a.status);
    });
    return order.map(function(k){
      var g = byKey[k];
      // Everything the single-asset renderers read comes off the primary, with the summed metrics
      // laid over it — so a merged group is drop-in compatible with an unmerged asset.
      g.merged = g.parts.length > 1;
      g.id = g.primary.id;
      g.campaign = g.campaignNames.join(' · ');
      g.market = g.primary.market;
      g.marketId = g.primary.marketId;
      // Any placement still live makes the creative live; otherwise take the furthest-along status.
      g.status = g.statuses.indexOf('Live on LinkedIn')!==-1 ? 'Live on LinkedIn' : g.primary.status;
      g.assignedTo = g.primary.assignedTo; g.dueDate = g.primary.dueDate;
      g.dateDelivered = g.primary.dateDelivered;
      g.version = g.primary.version; g.link = g.primary.link;
      g.adCopyLink = g.primary.adCopyLink; g.creativeLink = g.primary.creativeLink;
      g.metricsSource = g.primary.metricsSource;
      return g;
    });
  }

  function campaignsForMarket(marketId){ return campaigns.filter(function(c){return c.marketId===marketId;}); }
  // Only campaigns LinkedIn reports as delivering, unless the user asks to see everything. The
  // panel used to list every campaign ever created, which buried the handful actually running.
  function visibleCampaignsForMarket(marketId){
    var all = campaignsForMarket(marketId);
    if(showAllCampaigns) return all;
    // Before the first metadata sync no campaign has a status, and filtering on "live" would hide
    // every one of them — an empty panel that looks like data loss. Only filter once LinkedIn has
    // actually told us which are running.
    var anyKnown = all.some(function(c){ return c.status || c.servingStatus; });
    if(!anyKnown) return all;
    return all.filter(isCampaignLive);
  }
  function campaignMetricsRow(c){
    return { spend:c.spend, impressions:c.impressions, clicks:c.clicks, reach:c.reach, leads:c.leads, source:c.metricsSource };
  }
  // Everything LinkedIn reports for this campaign that means something for its objective.
  // Leads and CPL only appear on lead-gen campaigns; reach is omitted entirely (see metricList).
  function campaignMetricChips(cam){
    var d = derived(cam);
    var chips = [
      ['spend', fmtMoney(cam.spend)],
      ['impr', fmtInt(cam.impressions)],
      ['clicks', fmtInt(cam.clicks)],
      ['CTR', fmtPct(d.ctr)],
      ['CPC', fmtDec(d.cpc)],
      ['CPM', fmtDec(d.cpm)]
    ];
    if(isLeadGenCampaign(cam)){
      chips.push(['leads', fmtInt(cam.leads)]);
      if(num(cam.leads)>0) chips.push(['CPL', fmtDec(d.cpl)]);
    }
    return chips.map(function(x){ return '<span class="chip"><b>'+x[1]+'</b> '+x[0]+'</span>'; }).join('');
  }
  // ---- which companies have seen this ad set ----
  //
  // Mirrors Campaign Manager's Companies report. Fetched per campaign on demand rather than on the
  // sync: LinkedIn only serves this pivot as one aggregate for a date range (no daily breakdown to
  // store and re-slice), and the account reports engagement from hundreds of thousands of
  // companies, so pulling it for every campaign on a schedule would cost far more than it's worth.
  // Company engagement needs a longer window than spend does. LinkedIn suppresses demographic rows
  // below a privacy threshold and its demographic data lags a day or two, so a short or very recent
  // window legitimately comes back empty — on the 1st of the month "This month" is a single day and
  // returns nothing at all, while the same ad set over the previous month returns 100 companies.
  // Campaign Manager's own Companies report defaults to 90 days for exactly this reason.
  var COMPANY_FALLBACK_DAYS = 90;

  function companyWindowFor(range){
    if(range.start && range.end) return { start:range.start, end:range.end };
    return { start:addDaysIso(isoToday(), -(COMPANY_FALLBACK_DAYS-1)), end:isoToday() };
  }
  // Widened backwards from the end of the period being viewed, not from today — looking at Q1 and
  // being shown the 90 days ending now would answer a question nobody asked.
  function widerCompanyWindow(win){
    return { start:addDaysIso(win.end, -(COMPANY_FALLBACK_DAYS-1)), end:win.end };
  }
  function daysBetween(win){
    return Math.round((Date.parse(win.end+'T00:00:00Z')-Date.parse(win.start+'T00:00:00Z'))/86400000)+1;
  }

  function fetchCompanies(campaignId, win, refresh){
    return api('/api/campaigns/'+campaignId+'?companies=1&start='+win.start+'&end='+win.end
      + (refresh ? '&refresh=1' : ''));
  }

  async function loadCompaniesFor(campaignId, refresh){
    companyPanels[campaignId] = { loading:true };
    renderAll();
    try {
      var win = companyWindowFor(dateRange);
      var data = await fetchCompanies(campaignId, win, refresh);
      var state = { loading:false, open:true, data:data, window:win };
      // Retry over a wider window rather than leaving a dead end. Labelled in the panel, never
      // silent — showing 90 days of companies under a "Sep 2026" heading would be a lie.
      if(!data.companies.length && daysBetween(win) < COMPANY_FALLBACK_DAYS){
        var wide = widerCompanyWindow(win);
        var fallback = await fetchCompanies(campaignId, wide, refresh);
        if(fallback.companies.length){
          state.data = fallback; state.window = wide; state.widenedFrom = win;
        }
      }
      companyPanels[campaignId] = state;
    } catch(e){
      companyPanels[campaignId] = { loading:false, open:true, error:e.message };
    }
    renderAll();
  }

  function companyWindowLabel(state){
    var w = state.window;
    if(!w) return reportingPeriodLabel();
    return fmtDate(w.start)+' – '+fmtDate(w.end);
  }

  function engagementLevel(company, top){
    if(!top) return { label:'Low', filled:1 };
    var share = num(company.impressions)/top;
    if(share >= 0.5) return { label:'High', filled:4 };
    if(share >= 0.2) return { label:'Medium', filled:3 };
    if(share >= 0.05) return { label:'Low', filled:2 };
    return { label:'Minimal', filled:1 };
  }
  function engagementBars(level){
    var segs='';
    for(var i=0;i<4;i++){
      segs += '<span style="display:inline-block; width:11px; height:5px; border-radius:2px; margin-right:2px; background:'+(i<level.filled?'var(--indigo)':'var(--line)')+';"></span>';
    }
    return segs;
  }

  function companiesPanelHtml(cam){
    var state = companyPanels[cam.id];
    if(!state) return '';
    if(state.loading){
      return '<div style="padding:12px 0; font-size:11.5px; color:var(--faint);">Loading the companies that saw this ad set…</div>';
    }
    if(state.error){
      return '<div style="padding:12px 0; font-size:11.5px; color:var(--danger);">'+esc(state.error)+'</div>';
    }
    var list = (state.data && state.data.companies) || [];
    if(!list.length){
      // Say why, rather than leaving it looking like a failed request.
      return '<div style="padding:12px 0; font-size:11.5px; color:var(--faint); line-height:1.5;">'
        + 'LinkedIn reported no company engagement for this ad set over '+esc(companyWindowLabel(state))+'.'
        + '<br>Company-level reporting is withheld below a privacy threshold and lags a day or two, '
        + 'so short or very recent periods often come back empty even when the ad set is delivering. '
        + 'Try a wider date range.'
        + '</div>';
    }
    var top = num(list[0].impressions);
    var shown = state.showAll ? list : list.slice(0, 10);
    var rows = shown.map(function(co){
      var lvl = engagementLevel(co, top);
      var d = derived(co);
      return '<tr>'
        + '<td style="font-weight:600;">'+esc(co.name || ('Company '+co.companyId))+'</td>'
        + '<td style="white-space:nowrap;">'+engagementBars(lvl)+' <span style="font-size:10.5px; color:var(--muted); margin-left:4px;">'+lvl.label+'</span></td>'
        + '<td class="num">'+fmtInt(co.impressions)+'</td>'
        + '<td class="num">'+fmtInt(co.clicks)+'</td>'
        + '<td class="num">'+fmtInt(co.engagements)+'</td>'
        + '<td class="num">'+fmtPct(d.ctr)+'</td>'
        + '</tr>';
    }).join('');
    var fetched = state.data && state.data.fetchedAt ? timeAgo(new Date(state.data.fetchedAt).getTime()) : '';
    return '<div style="padding:10px 0 4px;">'
      + '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px;">'
      + '<div style="font-size:10.5px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em;">Companies that saw this ad set · '+esc(companyWindowLabel(state))+'</div>'
      + '<span class="chip">'+list.length+' companies</span>'
      + (state.widenedFrom ? '<span class="chip" style="background:var(--sky-tint); color:#7FD0F5;" title="LinkedIn returned nothing for the selected period — company reporting is withheld below a privacy threshold and lags a day or two. Widened to '+COMPANY_FALLBACK_DAYS+' days ending '+esc(state.window.end)+'.">nothing in '+esc(reportingPeriodLabel())+' · widened to '+COMPANY_FALLBACK_DAYS+' days</span>' : '')
      + (state.data && state.data.stale ? '<span class="chip" style="background:var(--amber-tint); color:#F6C860;" title="'+esc(state.data.error||'')+'">LinkedIn unreachable — showing the last good pull</span>' : '')
      + (fetched?'<span style="font-size:10.5px; color:var(--faint);">as of '+fetched+'</span>':'')
      + '<button class="btn btn-sm refresh-companies-btn" data-campaign="'+cam.id+'" style="margin-left:auto;">Refresh</button>'
      + '</div>'
      + '<div class="scroll-x"><table class="data-table" style="min-width:560px; font-size:12.5px;">'
      + '<thead><tr>'
      // "Level" rather than "Engagement" now that there's a paid-engagement number in the same
      // table — the bars rank a company against the top company by impressions, which is a
      // different thing from the engagement count two columns over.
      + companyTableHead([
          ['Company',0,''],
          ['Level',0,'How this company\'s impressions compare with the top company in this list'],
          ['Paid impr',1,'Impressions from sponsored delivery'],
          ['Paid clicks',1,'Chargeable clicks on the ads'],
          ['Paid engmt',1,'Every interaction with the ad — clicks plus reactions, comments, shares and follows'],
          ['CTR',1,'Paid clicks ÷ paid impressions']
        ])
      + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
      + (list.length>10 ? '<button class="btn btn-sm toggle-companies-btn" data-campaign="'+cam.id+'" style="margin-top:8px;">'+(state.showAll?'Show top 10':'Show all '+list.length)+'</button>' : '')
      + audienceBreakdownHtml(cam, state)
      + '</div>';
  }

  function companyTableHead(cols){
    return cols.map(function(h){
      return '<th'+(h[1]?' class="num"':'')+(h[2]?' title="'+esc(h[2])+'"':'')+'>'+h[0]+'</th>';
    }).join('');
  }

  // ---- job function / job title breakdown ----
  //
  // Sits under the company list because it answers the other half of "who saw this", but it is
  // deliberately a separate block: LinkedIn serves one demographic pivot per query and won't cross
  // two, so these are totals for the whole ad set and cannot be attributed to a company. Showing
  // them inside the company table would imply an attribution that doesn't exist.
  var BREAKDOWN_PREVIEW = 8;

  function facetTableHtml(cam, title, rows, key, showAll){
    if(!rows.length){
      return '<div style="flex:1; min-width:240px;">'
        + '<div style="font-size:10.5px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;">'+esc(title)+'</div>'
        + '<div style="font-size:11.5px; color:var(--faint);">Nothing above LinkedIn\'s reporting threshold.</div>'
        + '</div>';
    }
    var shown = showAll ? rows : rows.slice(0, BREAKDOWN_PREVIEW);
    var body = shown.map(function(r){
      return '<tr>'
        + '<td style="font-weight:600;">'+esc(r.name || (title+' '+r.id))+'</td>'
        + '<td class="num">'+fmtInt(r.impressions)+'</td>'
        + '<td class="num">'+fmtInt(r.clicks)+'</td>'
        + '<td class="num">'+fmtInt(r.engagements)+'</td>'
        + '</tr>';
    }).join('');
    return '<div style="flex:1; min-width:240px;">'
      + '<div style="font-size:10.5px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;">'+esc(title)+'</div>'
      + '<div class="scroll-x"><table class="data-table" style="min-width:240px; font-size:12.5px;">'
      + '<thead><tr>'
      + companyTableHead([[title,0,''],['Paid impr',1,''],['Paid clicks',1,''],['Paid engmt',1,'']])
      + '</tr></thead><tbody>'+body+'</tbody></table></div>'
      + (rows.length>BREAKDOWN_PREVIEW
          ? '<button class="btn btn-sm toggle-facet-btn" data-campaign="'+cam.id+'" data-facet="'+key+'" style="margin-top:6px;">'
            + (showAll?'Show top '+BREAKDOWN_PREVIEW:'Show all '+rows.length)+'</button>'
          : '')
      + '</div>';
  }

  function audienceBreakdownHtml(cam, state){
    var functions = (state.data && state.data.jobFunctions) || [];
    var titles = (state.data && state.data.jobTitles) || [];
    var err = (state.data && state.data.breakdownError) || '';
    if(!functions.length && !titles.length && !err) return '';
    return '<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--line-soft);">'
      + '<div style="font-size:11px; color:var(--faint); line-height:1.5; margin-bottom:9px;">'
      + 'Job function and job title for this ad set as a whole. '
      + 'LinkedIn reports one audience dimension at a time, so these <b>can\'t be broken down per company</b> — '
      + 'they cover the same '+esc(companyWindowLabel(state))+' window as the list above.'
      + (err
          ? '<br><span style="color:#E3B341;">Couldn\'t refresh these just now ('+esc(err)+') — showing the last good pull.</span>'
          : '')
      + '</div>'
      + '<div style="display:flex; gap:18px; flex-wrap:wrap;">'
      + facetTableHtml(cam, 'Job function', functions, 'jobFunctions', state.showAllFunctions)
      + facetTableHtml(cam, 'Job title', titles, 'jobTitles', state.showAllTitles)
      + '</div></div>';
  }

      var meta = [];

      if(cam.dailyBudget!=null) meta.push('budget '+fmtMoney(cam.dailyBudget)+'/day');
      if(cam.runStart) meta.push('from '+fmtDate(cam.runStart)+(cam.runEnd?' to '+fmtDate(cam.runEnd):''));
      return '<div style="padding:10px 0; border-bottom:1px dashed var(--line-soft);">'
        + '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">'

        + '<div style="font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap;">'+esc(cam.name)
        + '<span class="chip" style="'+(state.tone==='live'
            ? 'background:rgba(52,199,123,.16); color:#5BD99A;'
            : state.tone==='hold'
              ? 'background:rgba(240,180,60,.15); color:#E3B341;'
              : 'background:var(--line-soft); color:var(--faint);')+'">'
        + (state.tone==='live'?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34C77B;margin-right:5px;"></span>':'')
        + esc(state.text)+'</span></div>'
        + '<div style="font-size:11px; color:var(--faint);">'+(cam.liCampaignId?esc(cam.liCampaignId):'No LinkedIn campaign ID yet')+(m.source?' · '+(m.source==='sync'?'synced':'manual'):'')+(meta.length?' · '+meta.join(' · '):'')+'</div></div>'
        + '<button class="btn btn-sm companies-btn" data-campaign="'+cam.id+'"'+(cam.liCampaignId?'':' disabled title="Needs a LinkedIn campaign ID"')+'>'+icon('user',12,'currentColor',1.8)+' Companies'+(companyOpen?' ▴':' ▾')+'</button>'
        + '<button class="btn btn-sm log-metrics-btn" data-campaign="'+cam.id+'" data-campaign-name="'+esc(cam.name)+'">Log numbers</button>'
        + '<button class="btn btn-sm edit-campaign-btn" data-campaign="'+cam.id+'">Edit</button>'

    return '<div style="background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px;">'

      + '<label style="display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); cursor:pointer; white-space:nowrap;">'
      + '<input type="checkbox" class="toggle-all-campaigns"'+(showAllCampaigns?' checked':'')+' />'
      + '<span>Show non-live campaigns</span>'+(hidden>0?' <span class="chip" style="background:var(--line-soft); color:var(--faint);">'+hidden+' hidden</span>':'')
      + '</label>'
      + '<button class="btn btn-sm add-campaign-btn" data-market="'+c.id+'">+ Campaign</button>'
      + '</div>'
      + (rows || '<div style="font-size:12px; color:var(--faint);">'+emptyMsg+'</div>')
      + '</div>';
  }

  function assetsPanelHtml(c, filtered, list){
    // Merged after filtering, so a search that matches the creative still shows its full combined
    // total rather than only the placements whose campaign name happened to match too.
    var groups = mergeAssets(filtered);
    var mergedCount = groups.filter(function(g){return g.merged;}).length;
    return '<div style="background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px;">'
      + (c.link?'<div style="font-size:11.5px; color:var(--muted); margin-bottom:11px;" class="meta">'+icon('folder',13,'var(--faint)',1.8)+'<a href="'+esc(c.link)+'" target="_blank" rel="noopener">Shared folder</a> · via '+esc(c.channel||'—')+'</div>':'')
      + (mergedCount?'<div style="font-size:11px; color:var(--faint); margin-bottom:10px;">'+icon('stack',12,'currentColor',1.8)+' '+mergedCount+' creative'+(mergedCount===1?'':'s')+' run in more than one ad set — their numbers are combined. Tap the badge to break it down.</div>':'')
      + (groups.length ? groups.map(function(a){ return assetRowHtml(a); }).join('')
          : '<div style="text-align:center; padding:22px 8px; color:var(--faint);"><div class="icobox" style="justify-content:center;">'+icon(list.length?'search':'inbox',26,'var(--faint)',1.6)+'</div><div style="font-size:12.5px; margin-top:8px;">'+(list.length?'No assets match the current filter.':'No assets yet. Hit “+ Asset” to log the first one.')+'</div></div>')
      + '</div>';
  }

  function tabsHtml(c, list, filtered){
    var campaignCount = visibleCampaignsForMarket(c.id).length;
    return '<div class="swiper tab-thumb-swiper" data-id="'+c.id+'">'
      + '<div class="swiper-wrapper">'
      + '<div class="swiper-slide"><button type="button" class="tab-pill">'+icon('target',13,'currentColor',1.8)+'Campaigns <span class="tab-pill-count">'+campaignCount+'</span></button></div>'
      + '<div class="swiper-slide"><button type="button" class="tab-pill">'+icon('stack',13,'currentColor',1.8)+'Assets <span class="tab-pill-count">'+mergeAssets(list).length+'</span></button></div>'
      + '</div></div>'
      + '<div class="swiper tab-main-swiper" data-id="'+c.id+'">'
      + '<div class="swiper-wrapper">'
      + '<div class="swiper-slide">'+campaignsPanelHtml(c)+'</div>'
      + '<div class="swiper-slide">'+assetsPanelHtml(c, filtered, list)+'</div>'
      + '</div></div>';
  }

    var isOpen=expanded[c.id]!==false;

      + '<div class="country-header" data-id="'+c.id+'" style="padding:15px 17px; cursor:pointer; display:flex; align-items:center; gap:13px; flex-wrap:wrap; background:linear-gradient(90deg,'+accent+'22 0%, transparent 60%);">'
      + '<span class="flag icobox" style="width:40px; height:40px; border-radius:11px; background:#10141E; border:1px solid var(--line);">'+flagFor(c.country)+'</span>'
      + '<div style="min-width:150px;"><div class="disp" style="font-size:16px; font-weight:700;">'+esc(c.country)+'</div>'

      + (marketHasLeadGen(c.id)
          ? '<span class="chip" style="background:var(--indigo-tint); color:#AAB2FF;">'+icon('magnet',12,'currentColor',1.8)+'<b>'+fmtInt(t.leads)+'</b> leads</span>'
          : '<span class="chip" style="background:var(--indigo-tint); color:#AAB2FF;">'+icon('chart',12,'currentColor',1.8)+'<b>'+fmtInt(t.impressions)+'</b> impr</span>')
      + '<span class="chip" style="background:var(--sky-tint); color:#7FD0F5;">'+icon('send',12,'currentColor',1.8)+'<b>'+live+'</b> live</span>'
      + (overdue?'<span class="chip" style="background:var(--danger-tint); color:var(--danger);">'+icon('clock',12,'currentColor',1.8)+'<b>'+overdue+'</b> overdue</span>':'')
      + '</div>'
      + '<div style="display:flex; gap:6px; align-items:center;">'

      + '</div>'

      + '</div>'

      + tabsHtml(c, list, filtered)
      + '</div></div>';
  }

  // The card itself opens the asset; the merge badge and the per-ad-set lines inside it do their
  // own thing, so both stop the click before it reaches the card.
  function bindAssetCards(root){
    root.querySelectorAll('.asset-card').forEach(function(el){
      el.addEventListener('click', function(e){
        if(e.target.closest('.merge-toggle') || e.target.closest('.merged-part')) return;
        openAssetModal(Number(el.getAttribute('data-id')));
      });
    });
    root.querySelectorAll('.merge-toggle').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var k=el.getAttribute('data-key');
        expandedAssets[k] = !expandedAssets[k];
        renderAll();
      });
    });
    root.querySelectorAll('.merged-part').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); openAssetModal(Number(el.getAttribute('data-id'))); });
    });
  }

  function renderCountryBlocks(){
    document.getElementById('country-blocks').innerHTML = countries.map(countryBlockHtml).join('') || '<div style="color:var(--faint); font-size:13px;">No countries yet.</div>';
    document.querySelectorAll('.country-header').forEach(function(el){ el.addEventListener('click', function(e){ if(e.target.closest('.edit-country-btn')||e.target.closest('.add-asset-btn')||e.target.closest('a')) return; var id=el.getAttribute('data-id'); expanded[id]=!(expanded[id]!==false); renderCountryBlocks(); }); });
    document.querySelectorAll('.edit-country-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openCountryModal(Number(el.getAttribute('data-id'))); }); });
    document.querySelectorAll('.add-asset-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openAssetModal(null, Number(el.getAttribute('data-market'))); }); });
    bindAssetCards(document);
    document.querySelectorAll('.log-metrics-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openMetricsModal(Number(el.getAttribute('data-campaign')), el.getAttribute('data-campaign-name')); }); });
    document.querySelectorAll('.edit-campaign-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openCampaignModal(Number(el.getAttribute('data-campaign'))); }); });
    document.querySelectorAll('.add-campaign-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openCampaignModal(null, Number(el.getAttribute('data-market'))); }); });
    document.querySelectorAll('.companies-btn').forEach(function(el){ el.addEventListener('click', function(e){
      e.stopPropagation();
      var id=Number(el.getAttribute('data-campaign'));
      var state=companyPanels[id];
      // Collapse without discarding: reopening within the cache TTL shouldn't re-hit LinkedIn.
      if(state && state.open){ state.open=false; renderAll(); return; }
      if(state && state.data){ state.open=true; renderAll(); return; }
      loadCompaniesFor(id, false);
    }); });
    document.querySelectorAll('.refresh-companies-btn').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); loadCompaniesFor(Number(el.getAttribute('data-campaign')), true); }); });
    document.querySelectorAll('.toggle-companies-btn').forEach(function(el){ el.addEventListener('click', function(e){
      e.stopPropagation();
      var id=Number(el.getAttribute('data-campaign'));
      if(companyPanels[id]) companyPanels[id].showAll = !companyPanels[id].showAll;
      renderAll();
    }); });
    document.querySelectorAll('.toggle-facet-btn').forEach(function(el){ el.addEventListener('click', function(e){
      e.stopPropagation();
      var id=Number(el.getAttribute('data-campaign'));
      var key = el.getAttribute('data-facet')==='jobTitles' ? 'showAllTitles' : 'showAllFunctions';
      if(companyPanels[id]) companyPanels[id][key] = !companyPanels[id][key];
      renderAll();
    }); });
    document.querySelectorAll('.toggle-all-campaigns').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); }); el.addEventListener('change', function(){
      showAllCampaigns = el.checked;
      try { localStorage.setItem('showAllCampaigns', showAllCampaigns?'1':'0'); } catch(e){}
      renderAll();
    }); });
    initCountryTabSwipers();
  }

  function initCountryTabSwipers(){
    Object.keys(tabMainSwipers).forEach(function(id){ try{ tabMainSwipers[id].destroy(true,true); }catch(e){} });
    Object.keys(tabThumbSwipers).forEach(function(id){ try{ tabThumbSwipers[id].destroy(true,true); }catch(e){} });
    tabMainSwipers = {}; tabThumbSwipers = {};
    if(typeof Swiper === 'undefined') return;
    countries.forEach(function(c){
      if(expanded[c.id] === false) return;
      var thumbEl = document.querySelector('.tab-thumb-swiper[data-id="'+c.id+'"]');
      var mainEl = document.querySelector('.tab-main-swiper[data-id="'+c.id+'"]');
      if(!thumbEl || !mainEl) return;
      var startSlide = activeAssetTab[c.id] || 0;
      var thumbSwiper = new Swiper(thumbEl, { slidesPerView:'auto', spaceBetween:8, watchSlidesProgress:true, freeMode:true, initialSlide:startSlide });
      var mainSwiper = new Swiper(mainEl, {
        slidesPerView:1, autoHeight:true, allowTouchMove:true, initialSlide:startSlide,
        thumbs:{ swiper:thumbSwiper },
        on:{ slideChange:function(sw){ activeAssetTab[c.id]=sw.activeIndex; } }
      });
      tabThumbSwipers[c.id]=thumbSwiper; tabMainSwipers[c.id]=mainSwiper;
    });
  }

  function renderTableView(){
    var filtered=mergeAssets(assets.filter(matchesFilter));
    var anyLeadGen=filtered.some(assetHasLeadGen);
    var rows=filtered.map(function(a){
      var col=STATUS_COLOR[a.status]||STATUS_COLOR["Requested"];
      var overdue=isOverdue(a); var d=derived(a);
      var cfg=TYPE_CFG[a.type]||{ic:"document",color:"var(--muted)"};
      // A merged creative can span markets, so name every one it ran in rather than picking one.
      var markets = a.marketNames.length>1
        ? a.marketNames.map(function(n){ return flagFor(n); }).join(' ')+' '+a.marketNames.length+' markets'
        : flagFor(a.market)+' '+esc(a.market||'—');
